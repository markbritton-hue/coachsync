<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C1C1C" />
  <title>Reset Password — CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #6b7280 0%, #5a5f6b 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }
    .hero { padding-top: 60px; padding-bottom: 30px; text-align: center; }
    .hero-icon img { height: 130px; }
    .hero p { color: rgba(255,255,255,0.65); font-size: 1.05rem; margin-bottom: 0; }
    .login-card {
      background: linear-gradient(135deg, #114084, #1C1C1C);
      border: 1px solid rgba(53,102,171,0.3);
      border-radius: 20px;
      padding: 40px;
      max-width: 440px;
      margin: 30px auto 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .login-card h2 {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #3566AB, #3566AB);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 10px; text-align: center;
    }
    .login-card .subtext { color: rgba(255,255,255,0.5); font-size: 0.88rem; text-align: center; margin-bottom: 22px; }
    .field-label {
      color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block;
    }
    .field-input {
      background: rgba(28,28,28,0.7); border: 2px solid rgba(53,102,171,0.3);
      color: white; border-radius: 8px; padding: 12px; width: 100%;
      font-size: 0.95rem; margin-bottom: 16px; outline: none; box-sizing: border-box;
    }
    .field-input:focus { border-color: #3566AB; box-shadow: 0 0 0 3px rgba(53,102,171,0.2); }
    .field-input::placeholder { color: rgba(255,255,255,0.3); }
    .btn-auth {
      background: #3566AB; border: none; color: white; font-weight: 700;
      padding: 13px; border-radius: 25px; width: 100%; font-size: 1rem;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(53,102,171,0.3);
      margin-bottom: 12px;
    }
    .btn-auth:hover { background: #114084; transform: translateY(-2px); }
    .btn-auth:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    .auth-switch { text-align: center; color: rgba(255,255,255,0.45); font-size: 0.88rem; }
    .auth-switch a { color: #3566AB; text-decoration: none; font-weight: 600; }
    .auth-switch a:hover { color: #83B7DE; }
    .auth-error {
      color: #ef4444; font-size: 0.88rem; background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3); border-radius: 8px;
      padding: 10px 14px; margin-bottom: 14px; display: none;
    }
    .auth-success {
      color: #22c55e; font-size: 0.88rem; background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3); border-radius: 8px;
      padding: 10px 14px; margin-bottom: 14px; display: none;
    }
    .center-state { text-align: center; padding: 10px 0; }
    .center-state i { font-size: 2.4rem; margin-bottom: 14px; display: block; color: #3566AB; }
    @media (max-width: 768px) { .login-card { padding: 28px 20px; } }
  </style>
</head>
<body>

<div class="container" style="max-width:900px;">
  <div class="hero">
    <div class="hero-icon"><img src="CoachSyncLogo.png" alt="CoachSync"></div>
    <p>The all-in-one platform connecting athletes and trainers.</p>
  </div>

  <!-- Verifying the reset link -->
  <div class="login-card" id="verifyingCard">
    <div class="center-state">
      <i class="fa-solid fa-spinner fa-spin"></i>
      <p style="color:rgba(255,255,255,0.6);">Verifying your reset link…</p>
    </div>
  </div>

  <!-- Set new password -->
  <div class="login-card" id="resetCard" style="display:none;">
    <h2>Set a new password</h2>
    <p class="subtext" id="resetForEmail"></p>
    <div class="auth-error" id="resetFormError"></div>

    <label class="field-label" for="newPassword">New Password</label>
    <input type="password" class="field-input" id="newPassword" placeholder="At least 6 characters" autocomplete="new-password" />

    <label class="field-label" for="confirmPassword">Confirm Password</label>
    <input type="password" class="field-input" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password" />

    <button class="btn-auth" id="btnConfirmReset" onclick="doConfirmReset()">
      <i class="fa-solid fa-key me-2"></i>Set New Password
    </button>
  </div>

  <!-- Invalid/expired link -->
  <div class="login-card" id="invalidCard" style="display:none;">
    <div class="center-state">
      <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>
      <p style="color:rgba(255,255,255,0.6);" id="invalidMsg">This password reset link is invalid or has expired.</p>
    </div>
    <a href="index.html" class="btn-auth" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">
      <i class="fa-solid fa-arrow-left me-2"></i>Back to Sign In
    </a>
  </div>

  <!-- Success -->
  <div class="login-card" id="doneCard" style="display:none;">
    <div class="center-state">
      <i class="fa-solid fa-circle-check" style="color:#22c55e;"></i>
      <p style="color:rgba(255,255,255,0.6);">Your password has been reset. You can now sign in.</p>
    </div>
    <a href="index.html" class="btn-auth" style="display:block; text-align:center; text-decoration:none; box-sizing:border-box;">
      <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
    </a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const firebaseConfig = window.CoachSyncFirebaseConfig;
  if (!firebaseConfig) {
    throw new Error('Missing Firebase config. Create firebase-config.js from firebase-config.example.js.');
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const params = new URLSearchParams(window.location.search);
  const mode   = params.get('mode');
  const oobCode = params.get('oobCode');

  function showCard(id) {
    ['verifyingCard', 'resetCard', 'invalidCard', 'doneCard'].forEach(cid => {
      document.getElementById(cid).style.display = cid === id ? 'block' : 'none';
    });
  }

  (async function init() {
    if (mode !== 'resetPassword' || !oobCode) {
      document.getElementById('invalidMsg').textContent = 'This link is missing required information.';
      showCard('invalidCard');
      return;
    }
    try {
      const email = await auth.verifyPasswordResetCode(oobCode);
      document.getElementById('resetForEmail').textContent = email;
      showCard('resetCard');
    } catch (e) {
      document.getElementById('invalidMsg').textContent =
        'This password reset link is invalid or has expired. Please request a new one.';
      showCard('invalidCard');
    }
  })();

  async function doConfirmReset() {
    const pw  = document.getElementById('newPassword').value;
    const pw2 = document.getElementById('confirmPassword').value;
    const errEl = document.getElementById('resetFormError');
    errEl.style.display = 'none';

    if (!pw || pw.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.style.display = 'block';
      return;
    }
    if (pw !== pw2) {
      errEl.textContent = 'Passwords do not match.';
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('btnConfirmReset');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Saving…';
    try {
      await auth.confirmPasswordReset(oobCode, pw);
      showCard('doneCard');
    } catch (e) {
      errEl.textContent = e.code === 'auth/expired-action-code'
        ? 'This reset link has expired. Please request a new one.'
        : 'Something went wrong. Please request a new reset link and try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-key me-2"></i>Set New Password';
    }
  }
</script>
</body>
</html>
