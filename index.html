<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C1C1C" />
  <title>CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #6b7280 0%, #5a5f6b 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }

    /* ── Top nav ── */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 14px 24px;
      margin-bottom: 0;
    }
    .btn-signup-nav {
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 25px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s;
    }
    .btn-signup-nav:hover {
      border-color: #3566AB;
      color: #3566AB;
      background: rgba(53,102,171,0.08);
    }

    /* ── Hero ── */
    .hero {
      padding-top: 60px;
      padding-bottom: 60px;
      text-align: center;
    }
    .hero-icon {
      font-size: 3rem;
      color: #3566AB;
      margin-bottom: 16px;
      text-shadow: 0 0 30px rgba(53,102,171,0.5);
    }
    .hero h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3566AB, #3566AB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 14px;
    }
    .hero p {
      color: rgba(255,255,255,0.65);
      font-size: 1.15rem;
      margin-bottom: 40px;
    }

    /* ── Login card ── */
    .login-card {
      background: linear-gradient(135deg, #114084, #1C1C1C);
      border: 1px solid rgba(53,102,171,0.3);
      border-radius: 20px;
      padding: 40px;
      max-width: 440px;
      margin: 0 auto 60px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .login-card h2 {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3566AB, #3566AB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
      text-align: center;
    }
    .field-label {
      color: rgba(255,255,255,0.6);
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .field-input {
      background: rgba(28,28,28,0.7);
      border: 2px solid rgba(53,102,171,0.3);
      color: white;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      font-size: 0.95rem;
      margin-bottom: 16px;
      outline: none;
      box-sizing: border-box;
    }
    .field-input:focus {
      border-color: #3566AB;
      box-shadow: 0 0 0 3px rgba(53,102,171,0.2);
    }
    .field-input::placeholder { color: rgba(255,255,255,0.3); }
    .btn-auth {
      background: #3566AB;
      border: none;
      color: white;
      font-weight: 700;
      padding: 13px;
      border-radius: 25px;
      width: 100%;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(53,102,171,0.3);
      margin-bottom: 12px;
    }
    .btn-auth:hover { background: #114084; transform: translateY(-2px); }
    .btn-auth:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }
    .auth-switch {
      text-align: center;
      color: rgba(255,255,255,0.45);
      font-size: 0.88rem;
    }
    .auth-switch a { color: #3566AB; text-decoration: none; font-weight: 600; }
    .auth-switch a:hover { color: #83B7DE; }
    .auth-error {
      color: #ef4444;
      font-size: 0.88rem;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: none;
    }

    /* ── Feature cards ── */
    .feature-card {
      background: rgba(17,64,132,0.8);
      border: 1px solid rgba(53,102,171,0.2);
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      height: 100%;
    }
    .feature-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border-color: rgba(53,102,171,0.5);
    }
    .feature-icon { font-size: 3rem; margin-bottom: 16px; }
    .feature-card h3 { color: #3566AB; font-size: 1.2rem; font-weight: 700; margin-bottom: 10px; }
    .feature-card p { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin: 0; }

    @media (max-width: 768px) {
      .hero h1 { font-size: 1.8rem; }
      .login-card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<nav class="top-nav">
  <a href="signup.html" class="btn-signup-nav">
    <i class="fa-solid fa-user-plus"></i> Create Account
  </a>
</nav>

<div class="container" style="max-width:900px;">

  <div class="hero">
    <div class="hero-icon"><img src="CoachSyncLogo.png" alt="CoachSync" style="height:130px;"></div>
    <h1 style="display:none;">CoachSync</h1>
    <p>The all-in-one platform connecting athletes and trainers.</p>
  </div>

  <div class="login-card">
    <h2>Sign in to CoachSync</h2>
    <div class="auth-error" id="authError"></div>

    <label class="field-label" for="loginEmail">Email</label>
    <input type="email" class="field-input" id="loginEmail" placeholder="you@example.com" autocomplete="email" />

    <label class="field-label" for="loginPassword">Password</label>
    <input type="password" class="field-input" id="loginPassword" placeholder="Your password" autocomplete="current-password" />

    <button class="btn-auth" id="btnLogin" onclick="doLogin()">
      <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
    </button>

    <p class="auth-switch">New to CoachSync? <a href="signup.html">Create an account</a></p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const firebaseConfig = window.CoachSyncFirebaseConfig;
  if (!firebaseConfig) {
    throw new Error('Missing Firebase config. Create firebase-config.js from firebase-config.example.js.');
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  auth.onAuthStateChanged(async user => {
    if (user) {
      const snap = await db.collection('users').doc(user.uid).get();
      const role = snap.exists ? snap.data().role : 'athlete';
      window.location.href = role === 'trainer' ? 'trainer-dashboard.html' : 'athlete-dashboard.html';
    }
  });

  async function loginAsAthlete() {
    const btn = document.getElementById('btnAthlete');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';
    try {
      throw new Error('Quick test login has been removed. Sign in with an account or seed demo data instead.');
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-person-running"></i> Athlete View';
      alert('Login failed: ' + e.message);
    }
  }

  async function loginAsTrainer() {
    const btn = document.getElementById('btnTrainer');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';
    try {
      throw new Error('Quick test login has been removed. Sign in with an account or seed demo data instead.');
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-whistle"></i> Trainer View';
      alert('Login failed: ' + e.message);
    }
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function setLoading(on) {
    document.getElementById('btnLogin').disabled = on;
    document.getElementById('btnLogin').innerHTML = on
      ? '<i class="fa-solid fa-spinner fa-spin me-2"></i>Signing in…'
      : '<i class="fa-solid fa-right-to-bracket me-2"></i>Sign In';
  }

  async function redirectByRole(user) {
    const snap = await db.collection('users').doc(user.uid).get();
    const role = snap.exists ? snap.data().role : 'athlete';
    window.location.href = role === 'trainer' ? 'trainer-dashboard.html' : 'athlete-dashboard.html';
  }

  async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('authError').style.display = 'none';
    if (!email || !password) { showError('Please enter your email and password.'); return; }
    setLoading(true);
    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);
      await redirectByRole(cred.user);
    } catch (e) {
      showError(friendlyError(e.code));
      setLoading(false);
    }
  }

// Allow Enter key to submit
  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  function friendlyError(code) {
    const map = {
      'auth/user-not-found':      'No account found with that email.',
      'auth/wrong-password':      'Incorrect password. Please try again.',
      'auth/invalid-email':       'Please enter a valid email address.',
      'auth/too-many-requests':   'Too many attempts. Please wait a moment.',
      'auth/invalid-credential':  'Invalid email or password.',
      'auth/popup-closed-by-user':'Sign-in popup was closed.',
    };
    return map[code] || 'Sign-in failed. Please try again.';
  }
</script>
<script src="theme.js"></script>
</body>
</html>
