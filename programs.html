<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Programs — CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }

    /* ── Nav ── */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(80,184,240,0.15);
      background: rgba(15,23,42,0.6);
    }
    .nav-brand {
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { border-color: #50b8f0; color: #50b8f0; background: rgba(80,184,240,0.08); }
    .btn-logout {
      background: none; border: 1px solid rgba(239,68,68,0.4);
      color: rgba(239,68,68,0.8); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }

    /* ── Page header ── */
    .page-header {
      padding: 40px 0 30px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .page-header h1 {
      font-size: 1.8rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin: 0;
    }
    .page-header p { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 4px 0 0; }

    /* ── Buttons ── */
    .btn-primary-app {
      background: #50b8f0; border: none; color: white; font-weight: 700;
      padding: 11px 24px; border-radius: 25px; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(80,184,240,0.3);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary-app:hover { background: #1070c0; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(80,184,240,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.8); font-weight: 600;
      padding: 8px 18px; border-radius: 25px; font-size: 0.88rem;
      cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); }
    .btn-danger {
      background: none; border: 1px solid rgba(239,68,68,0.35);
      color: rgba(239,68,68,0.75); font-size: 0.82rem; font-weight: 600;
      padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
    }
    .btn-danger:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }
    /* ── Program cards ── */
    .programs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 48px; }
    .program-card {
      background: rgba(30,41,59,0.8); border: 1px solid rgba(80,184,240,0.2);
      border-radius: 15px; padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5); transition: all 0.3s ease;
      cursor: pointer; position: relative; overflow: hidden;
    }
    .program-card::before {
      content: '';
      position: absolute; inset: 0;
      background-size: 75%; background-repeat: no-repeat;
      background-position: center 110%;
      opacity: 0.06; pointer-events: none; filter: grayscale(1);
    }
    .program-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.6); border-color: rgba(80,184,240,0.5); }
    .program-card:hover::before { opacity: 0.10; }
    .program-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .program-card-title { font-size: 1.1rem; font-weight: 700; color: #50b8f0; margin: 0 0 4px; }
    .program-card-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .badge-pill {
      font-size: 0.75rem; font-weight: 600; padding: 3px 10px; border-radius: 20px;
      background: rgba(80,184,240,0.12); border: 1px solid rgba(80,184,240,0.3); color: #50b8f0;
    }
    .badge-pill.blue { background: rgba(30,143,224,0.12); border-color: rgba(30,143,224,0.3); color: #1e8fe0; }
    .badge-pill.green { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: #10b981; }
    .badge-pill.amber { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); color: #f59e0b; }
    .program-card-desc { color: rgba(255,255,255,0.55); font-size: 0.875rem; margin-bottom: 16px; line-height: 1.5; }
    .program-card-exercises { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; margin-bottom: 16px; }
    .exercise-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.875rem;
    }
    .exercise-row:last-child { border-bottom: none; }
    .exercise-name { color: rgba(255,255,255,0.85); font-weight: 500; }
    .exercise-detail { color: rgba(255,255,255,0.4); font-size: 0.8rem; }
    .program-card-footer { display: flex; gap: 8px; margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; }
    .btn-edit {
      background: rgba(80,184,240,0.12); border: 1px solid rgba(80,184,240,0.35);
      color: #50b8f0; font-size: 0.82rem; font-weight: 600;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-edit:hover { background: rgba(80,184,240,0.25); border-color: #50b8f0; }
    .no-programs {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
      color: rgba(255,255,255,0.3);
    }
    .no-programs i { font-size: 3rem; margin-bottom: 16px; display: block; color: rgba(80,184,240,0.3); }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 9999;
      align-items: flex-start; justify-content: center;
      padding: 20px; overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(80,184,240,0.3); border-radius: 20px;
      padding: 36px; width: 100%; max-width: 660px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8); margin: auto;
    }
    .modal-title {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
    }
    .field-label {
      color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block;
    }
    .field-input, .field-select, .field-textarea {
      background: rgba(15,23,42,0.7); border: 2px solid rgba(80,184,240,0.25);
      color: white; border-radius: 8px; padding: 11px 14px;
      width: 100%; font-size: 0.95rem; margin-bottom: 16px; outline: none; box-sizing: border-box;
    }
    .field-input:focus, .field-select:focus, .field-textarea:focus {
      border-color: #50b8f0; box-shadow: 0 0 0 3px rgba(80,184,240,0.15);
    }
    .field-input::placeholder, .field-textarea::placeholder { color: rgba(255,255,255,0.3); }
    .field-select option { background: #1e293b; color: white; }

    /* Light mode modal inputs */
    body.light-mode .modal-box .field-select,
    body.light-mode .modal-box .field-input,
    body.light-mode .modal-box .field-textarea {
      background: #f8fafc !important;
      border-color: rgba(30,143,224,0.3) !important;
      color: #1e293b !important;
    }
    body.light-mode .modal-box .field-select option { background: #ffffff; color: #1e293b; }
    body.light-mode .modal-box .field-input::placeholder,
    body.light-mode .modal-box .field-textarea::placeholder { color: #94a3b8 !important; }
    body.light-mode .modal-box .ex-input {
      background: #f1f5f9 !important;
      border-color: rgba(30,143,224,0.25) !important;
      color: #1e293b !important;
    }
    body.light-mode .modal-box .ex-input::placeholder { color: #94a3b8 !important; }
    body.light-mode .modal-box .ex-input option { background: #ffffff; color: #1e293b; }
    body.light-mode .modal-box .ex-mini-label { color: #64748b !important; }
    body.light-mode .modal-box .exercise-builder-row {
      background: #f0f4f8 !important;
      border-color: rgba(30,143,224,0.15) !important;
    }
    body.light-mode .modal-box select[id^="copy-target-"] {
      background: rgba(30,143,224,0.08) !important;
      border-color: rgba(30,143,224,0.35) !important;
      color: #1e8fe0 !important;
    }
    body.light-mode .modal-box .day-tab {
      background: #f1f5f9 !important;
      border-color: rgba(0,0,0,0.12) !important;
      color: #475569 !important;
    }
    body.light-mode .modal-box .day-tab.active {
      background: rgba(30,143,224,0.12) !important;
      border-color: #1e8fe0 !important;
      color: #1e8fe0 !important;
    }
    body.light-mode .modal-box .day-tabs-row { border-bottom-color: rgba(0,0,0,0.08) !important; }
    body.light-mode .modal-box .day-panel-label { color: #64748b !important; }
    body.light-mode .modal-box #noExercisesHint,
    body.light-mode .modal-box [id^="hint-day-"] { color: #94a3b8 !important; }

    /* ── Copy-to-day dropdown ── */
    #day-panel-header-0 select,
    select[id^="copy-target-"] {
      background: rgba(80,184,240,0.1);
      border: 1px solid rgba(80,184,240,0.35);
      color: #50b8f0;
      border-radius: 8px;
      font-weight: 600;
    }
    select[id^="copy-target-"] option { background: #1e293b; color: white; }
    .field-textarea { resize: vertical; min-height: 80px; font-family: inherit; }

    /* ── Day tabs ── */
    .day-tabs-wrap { margin-top: 8px; }
    .day-tabs-row {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px;
      border-bottom: 1px solid rgba(80,184,240,0.12); padding-bottom: 10px;
    }
    .day-tab {
      background: rgba(15,23,42,0.5); border: 1px solid rgba(80,184,240,0.2);
      color: rgba(255,255,255,0.55); font-size: 0.8rem; font-weight: 700;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.18s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .day-tab:hover { border-color: #50b8f0; color: #50b8f0; }
    .day-tab.active {
      background: rgba(80,184,240,0.18); border-color: #50b8f0;
      color: #50b8f0;
    }
    .day-tab .day-count {
      background: rgba(80,184,240,0.3); color: #50b8f0;
      font-size: 0.68rem; font-weight: 800; min-width: 16px; height: 16px;
      border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; padding: 0 4px;
    }
    .day-tab.active .day-count { background: #50b8f0; color: white; }
    .day-panel { display: none; }
    .day-panel.active { display: block; }
    .day-panel-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .day-panel-label {
      font-size: 0.82rem; font-weight: 700; color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 0.4px;
    }

    /* ── Exercise builder ── */
    .exercise-builder-row {
      background: rgba(15,23,42,0.5); border: 1px solid rgba(80,184,240,0.15);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; position: relative;
    }
    .exercise-builder-row .remove-ex {
      position: absolute; top: 10px; right: 12px;
      background: none; border: none; color: rgba(239,68,68,0.5);
      font-size: 1rem; cursor: pointer; padding: 0; line-height: 1;
    }
    .exercise-builder-row .remove-ex:hover { color: #ef4444; }
    .ex-grid { display: grid; grid-template-columns: 1fr 52px 96px 72px 78px 62px 82px 76px; gap: 10px; align-items: end; }
    .ex-grid-full { grid-column: 1 / -1; }
    .ex-mini-label {
      color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 5px; display: block;
    }
    .ex-input {
      background: rgba(15,23,42,0.8); border: 1px solid rgba(80,184,240,0.2);
      color: white; border-radius: 6px; padding: 8px 10px;
      width: 100%; font-size: 0.875rem; outline: none; box-sizing: border-box;
    }
    .ex-input:focus { border-color: #50b8f0; }
    .ex-input::placeholder { color: rgba(255,255,255,0.25); }
    .ex-notes { grid-column: 1/-1; }
    .target-weight-box {
      background: rgba(80,184,240,0.1); border: 1px solid rgba(80,184,240,0.25);
      color: #50b8f0; border-radius: 6px; padding: 8px 8px;
      width: 100%; min-height: 36px; font-size: 0.82rem; font-weight: 800;
      text-align: center; box-sizing: border-box;
    }
    .target-weight-box.empty { color: rgba(255,255,255,0.25); background: rgba(15,23,42,0.55); border-color: rgba(80,184,240,0.16); }

    /* ── Duplicate button ── */
    .btn-duplicate {
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.35);
      color: #10b981; font-size: 0.82rem; font-weight: 600;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-duplicate:hover { background: rgba(16,185,129,0.2); border-color: #10b981; }

    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
    .modal-footer .btn-cancel {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
      font-weight: 600; padding: 11px 24px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .modal-footer .btn-cancel:hover { border-color: rgba(255,255,255,0.4); color: white; }
    .modal-footer .btn-save {
      background: #50b8f0; border: none; color: white; font-weight: 700;
      padding: 11px 28px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(80,184,240,0.3);
    }
    .modal-footer .btn-save:hover { background: #1070c0; transform: translateY(-2px); }
    .modal-footer .btn-save:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid rgba(80,184,240,0.4);
      border-radius: 14px; padding: 14px 22px; z-index: 99999;
      display: none; align-items: center; gap: 10px;
      font-size: 0.9rem; color: rgba(255,255,255,0.85);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .toast.show { display: flex; }
    .toast.success { border-color: rgba(16,185,129,0.5); }
    .toast.error   { border-color: rgba(239,68,68,0.5); color: #ef4444; }

    .loading-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 1.1rem; color: rgba(255,255,255,0.5); gap: 12px;
    }

    @media (max-width: 575px) {
      .modal-box { padding: 24px 18px; }
      .ex-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .ex-grid > div:first-child { grid-column: 1 / -1; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <i class="fa-solid fa-spinner fa-spin"></i> Loading…
</div>

<!-- Nav -->
<nav class="top-nav">
  <a href="trainer-dashboard.html" class="nav-brand">
    <img src="CoachSyncLogo.png" alt="CoachSync" style="height:72px;">
  </a>
  <div class="nav-right">
    <a href="trainer-dashboard.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
    <button class="btn-logout" onclick="doSignOut()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>Sign Out
    </button>
  </div>
</nav>

<!-- Main -->
<div class="container" style="max-width:1100px;">

  <!-- Athlete context banner (shown when arriving from my-athletes) -->
  <div id="athleteContextBanner" style="display:none; background:rgba(80,184,240,0.08); border:1px solid rgba(80,184,240,0.3); border-radius:14px; padding:16px 22px; margin-top:28px; display:none; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:12px;">
      <i class="fa-solid fa-wand-magic-sparkles" style="color:#50b8f0; font-size:1.2rem;"></i>
      <div>
        <div style="font-weight:700; color:rgba(255,255,255,0.9);">Creating a custom program for <span id="bannerAthleteName" style="color:#50b8f0;"></span></div>
        <div style="font-size:0.82rem; color:rgba(255,255,255,0.45);">After saving, this program will be automatically assigned to this athlete.</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-shrink:0;">
      <button class="btn-primary-app" onclick="openModal()" style="padding:9px 18px;font-size:0.88rem;">
        <i class="fa-solid fa-plus"></i> Create Program
      </button>
      <a href="my-athletes.html" style="color:rgba(255,255,255,0.45); font-size:0.85rem; text-decoration:none; white-space:nowrap;">
        <i class="fa-solid fa-arrow-left me-1"></i> Back
      </a>
    </div>
  </div>

  <div class="page-header">
    <div>
      <h1><i class="fa-solid fa-clipboard-list me-2" style="font-size:1.5rem;"></i>Programs</h1>
      <p>Build and manage workout programs for your athletes.</p>
    </div>
    <button class="btn-primary-app" onclick="openModal()">
      <i class="fa-solid fa-plus"></i> New Program
    </button>
  </div>

  <!-- Filter bar -->
  <div class="d-flex gap-2 flex-wrap mb-4">
    <button class="btn-secondary active-filter" id="filter-all"    onclick="setFilter('all')">All</button>
    <button class="btn-secondary" id="filter-beginner" onclick="setFilter('Beginner')">Beginner</button>
    <button class="btn-secondary" id="filter-intermediate" onclick="setFilter('Intermediate')">Intermediate</button>
    <button class="btn-secondary" id="filter-advanced" onclick="setFilter('Advanced')">Advanced</button>
  </div>

  <!-- Programs grid -->
  <div class="programs-grid" id="programsGrid">
    <div class="no-programs" id="emptyState" style="display:none;">
      <i class="fa-solid fa-clipboard-list"></i>
      <p style="font-size:1rem; color:rgba(255,255,255,0.4);">No programs yet.<br>Click <strong style="color:#50b8f0;">+ New Program</strong> to create your first one.</p>
    </div>
  </div>
</div>

<!-- Create / Edit Modal -->
<div class="modal-overlay" id="programModal">
  <div class="modal-box">
    <h2 class="modal-title" id="modalTitle">New Program</h2>

    <div class="row g-3">
      <div class="col-12">
        <label class="field-label">Program Name</label>
        <input type="text" class="field-input" id="progName" placeholder="e.g. 8-Week Strength Builder" />
      </div>
      <div class="col-md-4">
        <label class="field-label">Difficulty</label>
        <select class="field-select" id="progDifficulty">
          <option value="Beginner">Beginner</option>
          <option value="Intermediate" selected>Intermediate</option>
          <option value="Advanced">Advanced</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="field-label">Duration</label>
        <select class="field-select" id="progDuration">
          <option>4 weeks</option>
          <option>6 weeks</option>
          <option selected>8 weeks</option>
          <option>10 weeks</option>
          <option>12 weeks</option>
          <option>Ongoing</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="field-label">Days / Week</label>
        <select class="field-select" id="progDays">
          <option>2 days</option>
          <option>3 days</option>
          <option selected>4 days</option>
          <option>5 days</option>
          <option>6 days</option>
        </select>
      </div>
      <div class="col-12">
        <label class="field-label">Goal / Focus</label>
        <select class="field-select" id="progGoal">
          <option>Strength</option>
          <option>Muscle Building (Hypertrophy)</option>
          <option>Fat Loss</option>
          <option>Endurance</option>
          <option>Athletic Performance</option>
          <option>Flexibility &amp; Mobility</option>
          <option>General Fitness</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="field-label">Est. Workout Time</label>
        <select class="field-select" id="progEstTime" style="margin-bottom:0;">
          <option value="">— Select —</option>
          <option>5 min</option>
          <option>10 min</option>
          <option>15 min</option>
          <option>20 min</option>
          <option>25 min</option>
          <option>30 min</option>
          <option>45 min</option>
          <option>60 min</option>
          <option>75 min</option>
          <option>90 min</option>
          <option>90+ min</option>
        </select>
      </div>
      <div class="col-12">
        <label class="field-label">Description</label>
        <textarea class="field-textarea" id="progDesc" placeholder="Brief overview of this program — what to expect, who it's for…"></textarea>
      </div>
    </div>

    <!-- Day-based exercises -->
    <div class="day-tabs-wrap">
      <label class="field-label" style="margin-bottom:10px;">Exercises by Day</label>
      <div class="day-tabs-row" id="dayTabsRow"></div>
      <div id="dayPanelsContainer"></div>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" id="btnSave" onclick="saveProgram()">
        <i class="fa-solid fa-floppy-disk me-1"></i> Save Program
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDnaS5J_-KkmFZcE3FtjjxV54cZkbWcop8",
    authDomain: "coachsync-7e07e.firebaseapp.com",
    projectId: "coachsync-7e07e",
    storageBucket: "coachsync-7e07e.firebasestorage.app",
    messagingSenderId: "774513797996",
    appId: "1:774513797996:web:e38f47773c5b487982e149"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUser    = null;
  let allPrograms    = [];
  let allAthletes    = [];
  let activeFilter   = 'all';
  let editingId      = null;
  const programMap   = new Map(); // id → program object

  // URL params
  const _params       = new URLSearchParams(window.location.search);
  const athleteUid    = _params.get('athlete');
  const athleteName   = _params.get('name');
  const editProgramId   = _params.get('editId');
  const editProgramName = _params.get('editName');
  const returnTo        = _params.get('returnTo'); // e.g. 'my-athletes'

  // ── Auth guard ──
  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists || snap.data().role !== 'trainer') {
      window.location.href = 'athlete-dashboard.html'; return;
    }
    currentUser = user;
    loadPrograms();
    loadAthletes();

    // Athlete context setup
    if (athleteUid && athleteName) {
      const banner = document.getElementById('athleteContextBanner');
      banner.style.display = 'flex';
      document.getElementById('bannerAthleteName').textContent = athleteName;
    }
  });

  // ── Load athletes ──
  function loadAthletes() {
    db.collection('users')
      .where('trainerId', '==', currentUser.uid)
      .onSnapshot(snap => {
        allAthletes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderPrograms();
      });
  }

  // ── Load programs ──
  function loadPrograms() {
    db.collection('programs')
      .where('trainerId', '==', currentUser.uid)
      .onSnapshot(snap => {
        allPrograms = snap.docs
          .map(d => ({ id: d.id, ...d.data(), id: d.id }))
          .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
        programMap.clear();
        allPrograms.forEach(p => programMap.set(p.id, p));
        renderPrograms();
        document.getElementById('loadingOverlay').style.display = 'none';
        if (editProgramId || editProgramName) {
          const target = allPrograms.find(p => p.id === editProgramId)
                      || allPrograms.find(p => p.name === editProgramName);
          if (target) loadProgramIntoModal(target);
        }
      }, err => {
        console.error(err);
        document.getElementById('loadingOverlay').style.display = 'none';
      });
  }

  // ── Render ──
  function renderPrograms() {
    const grid = document.getElementById('programsGrid');
    const empty = document.getElementById('emptyState');
    const filtered = activeFilter === 'all'
      ? allPrograms
      : allPrograms.filter(p => p.difficulty === activeFilter);

    [...grid.querySelectorAll('.program-card')].forEach(c => c.remove());

    if (filtered.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    filtered.forEach(prog => {
      const p = prog; // capture for closures
      const diffColor = { Beginner: 'green', Intermediate: 'amber', Advanced: 'blue' }[p.difficulty] || '';

      const card = document.createElement('div');
      card.className = 'program-card';

      // Header
      const header = document.createElement('div');
      header.className = 'program-card-header';
      const title = document.createElement('h3');
      title.className = 'program-card-title';
      title.textContent = p.name || '';
      header.appendChild(title);
      card.appendChild(header);

      // Meta badges
      const meta = document.createElement('div');
      meta.className = 'program-card-meta';
      const startDateStr = p.startDate
        ? new Date(p.startDate + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
        : null;
      const badges = [
        { cls: diffColor, html: esc(p.difficulty) },
        { cls: '', html: '<i class="fa-regular fa-clock me-1"></i>' + esc(p.duration) },
        { cls: '', html: '<i class="fa-solid fa-calendar-days me-1"></i>' + esc(p.daysPerWeek) },
        { cls: '', html: '<i class="fa-solid fa-bullseye me-1"></i>' + esc(p.goal) },
        ...(p.estWorkoutTime ? [{ cls: 'amber', html: '<i class="fa-solid fa-stopwatch me-1"></i>' + esc(p.estWorkoutTime) }] : []),
        ...(startDateStr ? [{ cls: 'green', html: '<i class="fa-solid fa-calendar-check me-1"></i>Starts ' + startDateStr }] : []),
      ];
      badges.forEach(b => {
        const span = document.createElement('span');
        span.className = 'badge-pill' + (b.cls ? ' ' + b.cls : '');
        span.innerHTML = b.html;
        meta.appendChild(span);
      });
      card.appendChild(meta);

      // Description
      if (p.description) {
        const desc = document.createElement('p');
        desc.className = 'program-card-desc';
        desc.textContent = p.description;
        card.appendChild(desc);
      }

      // Exercise summary — total count only
      const allEx = (p.days && p.days.length > 0)
        ? p.days.reduce((sum, d) => sum + (d.exercises?.length || 0), 0)
        : (p.exercises || []).length;

      if (allEx > 0) {
        const exSection = document.createElement('div');
        exSection.className = 'program-card-exercises';
        const summary = document.createElement('p');
        summary.style.cssText = 'color:rgba(255,255,255,0.5);font-size:0.85rem;margin:0;';
        summary.innerHTML = `<i class="fa-solid fa-dumbbell me-1" style="color:#50b8f0;"></i>${allEx} exercise${allEx !== 1 ? 's' : ''}`;
        exSection.appendChild(summary);
        card.appendChild(exSection);
      }

      // Athletes assigned to this program
      const assignedAthletes = allAthletes.filter(a => {
        const list = a.assignedPrograms || (a.assignedProgram ? [a.assignedProgram] : []);
        return list.includes(p.name);
      });
      const athleteSection = document.createElement('div');
      athleteSection.style.cssText = 'border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;margin-bottom:14px;';
      const athleteLabel = document.createElement('div');
      athleteLabel.style.cssText = 'color:rgba(255,255,255,0.4);font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:8px;';
      athleteLabel.textContent = 'Assigned Athletes';
      athleteSection.appendChild(athleteLabel);
      if (assignedAthletes.length === 0) {
        const none = document.createElement('div');
        none.style.cssText = 'color:rgba(255,255,255,0.25);font-size:0.82rem;';
        none.textContent = 'No athletes assigned';
        athleteSection.appendChild(none);
      } else {
        const chips = document.createElement('div');
        chips.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px;';
        assignedAthletes.forEach(a => {
          const chip = document.createElement('div');
          chip.style.cssText = 'display:inline-flex;align-items:center;gap:5px;background:rgba(114,184,50,0.12);border:1px solid rgba(114,184,50,0.3);border-radius:20px;padding:3px 10px;font-size:0.78rem;color:#72b832;font-weight:600;';
          const initials = getInitials(a.displayName || a.email || '?');
          chip.innerHTML = `<span style="width:18px;height:18px;border-radius:50%;background:rgba(114,184,50,0.25);display:inline-flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:800;">${initials}</span>${a.displayName || a.email}`;
          chips.appendChild(chip);
        });
        athleteSection.appendChild(chips);
      }
      card.appendChild(athleteSection);

      // Footer with buttons
      const footer = document.createElement('div');
      footer.className = 'program-card-footer';

      const editBtn = document.createElement('button');
      editBtn.className = 'btn-edit';
      editBtn.innerHTML = '<i class="fa-solid fa-pen me-1"></i>Edit';
      editBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        loadProgramIntoModal(p);
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn-danger';
      deleteBtn.innerHTML = '<i class="fa-solid fa-trash me-1"></i>Delete';
      deleteBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        deleteProgram(p.id, p.name);
      });

      footer.appendChild(editBtn);
      footer.appendChild(deleteBtn);
      card.appendChild(footer);

      grid.appendChild(card);
    });
  }

  // ── Filter ──
  function setFilter(val) {
    activeFilter = val;
    document.querySelectorAll('.active-filter').forEach(b => b.classList.remove('active-filter'));
    document.getElementById('filter-' + val.toLowerCase()).classList.add('active-filter');
    renderPrograms();
  }

  // ── Modal ──
  let exCounter   = 0;   // global unique id for each exercise row
  let activeDayIdx = 0;
  let dayCount    = 4;

  // Parse "4 days" → 4
  function parseDayCount(str) {
    return parseInt(str) || 4;
  }

  // Build / rebuild the day tabs + panels
  function buildDayUI(count, existingDays = []) {
    dayCount    = count;
    activeDayIdx = 0;
    const tabsRow  = document.getElementById('dayTabsRow');
    const container = document.getElementById('dayPanelsContainer');
    tabsRow.innerHTML = '';
    container.innerHTML = '';

    for (let d = 0; d < count; d++) {
      // Tab
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'day-tab' + (d === 0 ? ' active' : '');
      tab.id = `day-tab-${d}`;
      tab.onclick = () => switchDay(d);
      tab.innerHTML = `Day ${d + 1} <span class="day-count" id="day-count-${d}">0</span>`;
      tabsRow.appendChild(tab);

      // Panel
      const panel = document.createElement('div');
      panel.className = 'day-panel' + (d === 0 ? ' active' : '');
      panel.id = `day-panel-${d}`;

      const header = document.createElement('div');
      header.className = 'day-panel-header';
      header.id = `day-panel-header-${d}`;
      header.innerHTML = `
        <span class="day-panel-label">Day ${d + 1} Exercises</span>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:5px;">
            <button type="button" class="btn-secondary" onclick="copyDayTo(${d})" style="font-size:0.78rem;padding:5px 12px;" title="Copy exercises to another day">
              <i class="fa-solid fa-copy"></i> Copy to
            </button>
            <select id="copy-target-${d}" class="ex-input" style="width:80px;padding:5px 8px;font-size:0.78rem;">
            </select>
          </div>
          <button type="button" class="btn-secondary" onclick="addExerciseRow({}, ${d})" style="font-size:0.82rem;padding:6px 14px;">
            <i class="fa-solid fa-plus"></i> Add Exercise
          </button>
        </div>`;
      panel.appendChild(header);

      const list = document.createElement('div');
      list.id = `exercises-day-${d}`;
      panel.appendChild(list);

      const hint = document.createElement('p');
      hint.id = `hint-day-${d}`;
      hint.style.cssText = 'color:rgba(255,255,255,0.3);font-size:0.85rem;text-align:center;padding:16px 0;';
      hint.innerHTML = `No exercises yet. Click <strong style="color:#50b8f0;">+ Add Exercise</strong> above.`;
      panel.appendChild(hint);

      container.appendChild(panel);

      // Load existing exercises for this day
      const dayData = existingDays[d];
      if (dayData && dayData.exercises) {
        dayData.exercises.forEach(ex => addExerciseRow(ex, d));
      }
      updateDayHint(d);
    }

    // Populate all copy-target dropdowns (exclude self)
    for (let d = 0; d < count; d++) {
      const sel = document.getElementById(`copy-target-${d}`);
      if (!sel) continue;
      sel.innerHTML = '';
      for (let t = 0; t < count; t++) {
        if (t === d) continue;
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `Day ${t + 1}`;
        sel.appendChild(opt);
      }
    }
  }

  function copyDayTo(fromDay) {
    const sel = document.getElementById(`copy-target-${fromDay}`);
    if (!sel) return;
    const toDay = parseInt(sel.value);

    // Collect exercises from the source day
    const srcList = document.getElementById(`exercises-day-${fromDay}`);
    if (!srcList) return;
    const rows = srcList.querySelectorAll('.exercise-builder-row');
    if (rows.length === 0) { showToast('No exercises on this day to copy.', 'error'); return; }

    const exercises = [...rows].map(row => {
      const idx = row.id.split('-')[1];
      return {
        name:     (document.getElementById('ex-name-'  + idx)?.value  || '').trim(),
        sets:     (document.getElementById('ex-sets-'  + idx)?.value  || '').trim(),
        type:      document.getElementById('ex-type-'  + idx)?.value  || 'Reps',
        value:    (document.getElementById('ex-value-' + idx)?.value  || '').trim(),
        weight:   (document.getElementById('ex-weight-'+ idx)?.value  || '').trim(),
        percent:  (document.getElementById('ex-percent-'+ idx)?.value || '').trim(),
        targetWeight: getTargetWeightValue(idx),
        rest:     (document.getElementById('ex-rest-'  + idx)?.value  || '').trim(),
        notes:    (document.getElementById('ex-notes-' + idx)?.value  || '').trim(),
        videoUrl: (document.getElementById('ex-video-' + idx)?.value  || '').trim(),
      };
    }).filter(ex => ex.name);

    // Add them to the target day
    exercises.forEach(ex => addExerciseRow(ex, toDay));

    // Switch to the target day so the user can see the result
    switchDay(toDay);
    showToast(`Copied ${exercises.length} exercise${exercises.length > 1 ? 's' : ''} to Day ${toDay + 1}.`, 'success');
  }

  function switchDay(idx) {
    activeDayIdx = idx;
    document.querySelectorAll('.day-tab').forEach((t, i) => t.classList.toggle('active', i === idx));
    document.querySelectorAll('.day-panel').forEach((p, i) => p.classList.toggle('active', i === idx));
  }

  function updateDayHint(dayIdx) {
    const list  = document.getElementById(`exercises-day-${dayIdx}`);
    const hint  = document.getElementById(`hint-day-${dayIdx}`);
    const count = list ? list.querySelectorAll('.exercise-builder-row').length : 0;
    if (hint) hint.style.display = count === 0 ? 'block' : 'none';
    const countEl = document.getElementById(`day-count-${dayIdx}`);
    if (countEl) countEl.textContent = count;
  }

  function openModal(reset = true) {
    if (reset) {
      editingId = null;
      document.getElementById('modalTitle').textContent =
        athleteUid && athleteName ? `New Program for ${athleteName}` : 'New Program';
      document.getElementById('progName').value = '';
      document.getElementById('progDifficulty').value = 'Intermediate';
      document.getElementById('progDuration').value = '8 weeks';
      document.getElementById('progDays').value = '4 days';
      document.getElementById('progGoal').value = 'Strength';
      document.getElementById('progDesc').value    = '';
      document.getElementById('progEstTime').value = '';
      exCounter = 0;
      buildDayUI(4);
    }
    document.getElementById('programModal').classList.add('open');
    document.getElementById('btnSave').disabled = false;
    document.getElementById('btnSave').innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Save Program';
  }

  function closeModal() {
    document.getElementById('programModal').classList.remove('open');
  }

  // Rebuild days when "Days / Week" selector changes
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('progDays').addEventListener('change', function() {
      const n = parseDayCount(this.value);
      // Collect current data before rebuild
      const current = collectDays();
      buildDayUI(n, current);
    });
  });

  function addExerciseRow(data = {}, dayIdx = activeDayIdx) {
    exCounter++;
    const idx  = exCounter;
    const type = data.type || 'Reps';
    const valueLabel       = type === 'Timed' ? 'Time (sec)' : type === 'Cals' ? 'Calories' : 'Reps';
    const valuePlaceholder = type === 'Timed' ? '45'  : type === 'Cals' ? '20' : '8';

    const container = document.getElementById(`exercises-day-${dayIdx}`);
    if (!container) return;

    container.insertAdjacentHTML('beforeend', `
      <div class="exercise-builder-row" id="ex-${idx}" data-day="${dayIdx}">
        <button class="remove-ex" onclick="removeExercise(${idx}, ${dayIdx})" title="Remove"><i class="fa-solid fa-xmark"></i></button>
        <div class="ex-grid">
          <div>
            <span class="ex-mini-label">Exercise Name</span>
            <input class="ex-input" id="ex-name-${idx}" placeholder="e.g. Barbell Squat" value="${esc(data.name||'')}" />
          </div>
          <div>
            <span class="ex-mini-label">Sets</span>
            <input class="ex-input" id="ex-sets-${idx}" placeholder="3" value="${esc(data.sets||'')}" style="text-align:center;" />
          </div>
          <div>
            <span class="ex-mini-label">Type</span>
            <select class="ex-input" id="ex-type-${idx}" onchange="updateExValueLabel(${idx})" style="padding:7px 6px;">
              <option value="Reps"${type==='Reps'?' selected':''}>Reps</option>
              <option value="Timed"${type==='Timed'?' selected':''}>Timed</option>
              <option value="Cals"${type==='Cals'?' selected':''}>Cals</option>
            </select>
          </div>
          <div>
            <span class="ex-mini-label" id="ex-value-label-${idx}">${valueLabel}</span>
            <input class="ex-input" id="ex-value-${idx}" placeholder="${valuePlaceholder}" value="${esc(data.value||data.reps||'')}" style="text-align:center;" />
          </div>
          <div>
            <span class="ex-mini-label">Weight</span>
            <input class="ex-input" id="ex-weight-${idx}" placeholder="lbs" value="${esc(data.weight||'')}" oninput="updateTargetWeight(${idx})" style="text-align:center;" />
          </div>
          <div>
            <span class="ex-mini-label">%</span>
            <input class="ex-input" id="ex-percent-${idx}" placeholder="75" value="${esc(data.percent||'')}" oninput="updateTargetWeight(${idx})" style="text-align:center;" />
          </div>
          <div>
            <span class="ex-mini-label">Target</span>
            <div class="target-weight-box empty" id="ex-target-${idx}">—</div>
          </div>
          <div>
            <span class="ex-mini-label">Rest (sec)</span>
            <input class="ex-input" id="ex-rest-${idx}" placeholder="90" value="${esc(data.rest||'')}" style="text-align:center;" />
          </div>
          <div class="ex-notes">
            <span class="ex-mini-label">Notes / Cues</span>
            <input class="ex-input" id="ex-notes-${idx}" placeholder="e.g. Keep chest up, drive knees out" value="${esc(data.notes||'')}" />
          </div>
          <div class="ex-notes" style="margin-top:6px;">
            <span class="ex-mini-label"><i class="fa-solid fa-video" style="color:#50b8f0;margin-right:4px;"></i>Instructional Video Link</span>
            <input class="ex-input" id="ex-video-${idx}" placeholder="https://youtube.com/watch?v=..." value="${esc(data.videoUrl||'')}" />
          </div>
        </div>
      </div>`);

    updateTargetWeight(idx);
    updateDayHint(dayIdx);
  }

  function updateExValueLabel(idx) {
    const type = document.getElementById('ex-type-' + idx).value;
    const label = type === 'Timed' ? 'Time (sec)' : type === 'Cals' ? 'Calories' : 'Reps';
    const ph    = type === 'Timed' ? '45' : type === 'Cals' ? '20' : '8';
    document.getElementById('ex-value-label-' + idx).textContent = label;
    document.getElementById('ex-value-' + idx).placeholder = ph;
  }

  function parseLoadNumber(value) {
    const match = String(value || '').match(/\d+(\.\d+)?/);
    return match ? parseFloat(match[0]) : null;
  }

  function formatLoad(value) {
    if (value == null || Number.isNaN(value)) return '';
    const rounded = Math.round(value * 10) / 10;
    return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
  }

  function getTargetWeightValue(idx) {
    const base = parseLoadNumber(document.getElementById('ex-weight-' + idx)?.value);
    const pct  = parseLoadNumber(document.getElementById('ex-percent-' + idx)?.value);
    if (base == null || pct == null) return '';
    return formatLoad(base * (pct / 100));
  }

  function updateTargetWeight(idx) {
    const el = document.getElementById('ex-target-' + idx);
    if (!el) return;
    const target = getTargetWeightValue(idx);
    if (!target) {
      el.textContent = '—';
      el.classList.add('empty');
      return;
    }
    el.textContent = target + ' lb';
    el.classList.remove('empty');
  }

  function removeExercise(idx, dayIdx) {
    document.getElementById('ex-' + idx).remove();
    updateDayHint(dayIdx);
  }

  // Collect all days as array of { label, exercises }
  function collectDays() {
    const result = [];
    for (let d = 0; d < dayCount; d++) {
      const list = document.getElementById(`exercises-day-${d}`);
      if (!list) { result.push({ label: `Day ${d+1}`, exercises: [] }); continue; }
      const rows = list.querySelectorAll('.exercise-builder-row');
      const exercises = [...rows].map(row => {
        const idx = row.id.split('-')[1];
        return {
          name:     (document.getElementById('ex-name-'  + idx)?.value  || '').trim(),
          sets:     (document.getElementById('ex-sets-'  + idx)?.value  || '').trim(),
          type:      document.getElementById('ex-type-'  + idx)?.value  || 'Reps',
          value:    (document.getElementById('ex-value-' + idx)?.value  || '').trim(),
          weight:   (document.getElementById('ex-weight-'+ idx)?.value  || '').trim(),
          percent:  (document.getElementById('ex-percent-'+ idx)?.value || '').trim(),
          targetWeight: getTargetWeightValue(idx),
          rest:     (document.getElementById('ex-rest-'  + idx)?.value  || '').trim(),
          notes:    (document.getElementById('ex-notes-' + idx)?.value  || '').trim(),
          videoUrl: (document.getElementById('ex-video-' + idx)?.value  || '').trim(),
        };
      }).filter(ex => ex.name);
      result.push({ label: `Day ${d + 1}`, exercises });
    }
    return result;
  }

  // Flatten days to single exercise list for backward compat
  function flattenDays(days) {
    return days.flatMap(d => d.exercises || []);
  }

  // ── Save ──
  async function saveProgram() {
    const name = document.getElementById('progName').value.trim();
    if (!name) { showToast('Please enter a program name.', 'error'); return; }

    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Saving…';

    const days = collectDays();
    const data = {
      name,
      difficulty:  document.getElementById('progDifficulty').value,
      duration:    document.getElementById('progDuration').value,
      daysPerWeek: document.getElementById('progDays').value,
      goal:        document.getElementById('progGoal').value,
      description: document.getElementById('progDesc').value.trim(),
      estWorkoutTime: document.getElementById('progEstTime').value || null,
      days,
      exercises:   flattenDays(days), // backward compat for workouts page
      trainerId:   currentUser.uid,
    };

    try {
      if (editingId) {
        await db.collection('programs').doc(editingId).update({ ...data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        showToast('Program updated!', 'success');
        if (returnTo === 'my-athletes') {
          setTimeout(() => { window.location.href = 'my-athletes.html'; }, 900);
        } else {
          closeModal();
        }
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('programs').add(data);

        if (athleteUid) {
          // Auto-assign this program to the athlete and go back
          await db.collection('users').doc(athleteUid).update({ assignedPrograms: firebase.firestore.FieldValue.arrayUnion(name) });
          showToast(`Program created & assigned to ${athleteName}!`, 'success');
          setTimeout(() => { window.location.href = 'my-athletes.html'; }, 1200);
        } else {
          showToast('Program created!', 'success');
          closeModal();
        }
      }
    } catch (e) {
      showToast('Error saving program: ' + e.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Save Program';
    }
  }

  // ── Edit ──
  function loadProgramIntoModal(p) {
    editingId = p.id;
    document.getElementById('modalTitle').textContent = 'Edit Program';
    document.getElementById('progName').value       = p.name || '';
    document.getElementById('progDifficulty').value = p.difficulty || 'Intermediate';
    document.getElementById('progDuration').value   = p.duration || '8 weeks';
    document.getElementById('progDays').value       = p.daysPerWeek || '4 days';
    document.getElementById('progGoal').value       = p.goal || 'Strength';
    document.getElementById('progDesc').value      = p.description || '';
    document.getElementById('progEstTime').value   = p.estWorkoutTime || '';
    exCounter = 0;

    const n = parseDayCount(p.daysPerWeek || '4 days');

    // Support both new format (days array) and old format (flat exercises)
    let existingDays;
    if (p.days && p.days.length > 0) {
      existingDays = p.days;
    } else if (p.exercises && p.exercises.length > 0) {
      // Old format — put all exercises on Day 1
      existingDays = [{ label: 'Day 1', exercises: p.exercises }];
    } else {
      existingDays = [];
    }

    buildDayUI(n, existingDays);
    openModal(false);
  }

  // ── Duplicate ──
  async function duplicateProgram(p) {
    const copy = { ...p };
    delete copy.id;
    copy.name = 'Copy of ' + copy.name;
    copy.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    delete copy.updatedAt;
    try {
      await db.collection('programs').add(copy);
      showToast(`"${copy.name}" created!`, 'success');
    } catch(e) {
      showToast('Error duplicating program.', 'error');
    }
  }

  // ── Delete ──
  async function deleteProgram(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      await db.collection('programs').doc(id).delete();
      showToast('Program deleted.', 'success');
    } catch (e) {
      showToast('Error deleting program.', 'error');
    }
  }

  // ── Toast ──
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.className = 'toast show ' + type;
    t.innerHTML = (type === 'success' ? '<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> ' : '<i class="fa-solid fa-circle-exclamation"></i> ') + msg;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Sign out ──
  async function doSignOut() { await auth.signOut(); window.location.href = 'index.html'; }

  // ── Helpers ──
  function getInitials(name) {
    const parts = String(name).trim().split(' ');
    return parts.length >= 2
      ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
      : String(name).slice(0, 2).toUpperCase();
  }

  // ── Escape HTML ──
  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Close modal on backdrop click
  document.getElementById('programModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });



  // Active filter style
  const style = document.createElement('style');
  style.textContent = '.active-filter { background: rgba(80,184,240,0.2) !important; border-color: rgba(80,184,240,0.5) !important; color: #50b8f0 !important; }';
  document.head.appendChild(style);

  // Init day UI on load so the modal is ready
  buildDayUI(4);
</script>
<script src="theme.js"></script>
</body>
</html>
