<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <title>Admin Cleanup — CoachSync</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body { background:#0f172a; color:white; font-family:sans-serif; padding:40px; max-width:620px; margin:0 auto; }
    h1 { color:#f59e0b; margin-bottom:8px; }
    p  { color:rgba(255,255,255,0.5); margin-bottom:24px; }
    .config { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:20px; margin-bottom:20px; }
    label { display:block; color:rgba(255,255,255,0.5); font-size:0.8rem; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; margin-top:14px; }
    input { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2); color:white; padding:10px 14px; border-radius:8px; width:100%; box-sizing:border-box; font-size:0.95rem; }
    .btn { border:none; color:white; font-weight:700; padding:12px 28px; border-radius:25px; cursor:pointer; font-size:1rem; margin-top:12px; width:100%; }
    .btn-red    { background:#ef4444; }
    .btn-amber  { background:#f59e0b; }
    .btn-blue   { background:#50b8f0; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; }
    .divider { border:none; border-top:1px solid rgba(255,255,255,0.1); margin:24px 0; }
    .section-label { font-size:0.75rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:rgba(255,255,255,0.3); margin-bottom:12px; }
    .danger-box { background:rgba(239,68,68,0.06); border:1px solid rgba(239,68,68,0.25); border-radius:10px; padding:20px; margin-bottom:12px; }
    .log { margin-top:20px; background:rgba(0,0,0,0.4); border-radius:10px; padding:16px; font-family:monospace; font-size:0.85rem; line-height:1.7; max-height:360px; overflow-y:auto; display:none; }
    .ok   { color:#10b981; }
    .err  { color:#ef4444; }
    .info { color:#50b8f0; }
    .warn { color:#f59e0b; }
  </style>
</head>
<body>
  <h1>⚠️ Admin Cleanup</h1>
  <p>Irreversible data operations. Sign in first.</p>

  <!-- Sign in -->
  <div class="config" id="loginSection">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="your@email.com" />
    <label>Password</label>
    <input id="loginPassword" type="password" placeholder="••••••••" />
    <button class="btn btn-blue" id="loginBtn" onclick="doLogin()" style="margin-top:14px;">Sign In</button>
    <div id="loginStatus" style="margin-top:10px;font-size:0.85rem;color:rgba(255,255,255,0.4);"></div>
  </div>

  <div id="mainSection" style="display:none;">
    <div id="signedInAs" style="color:#10b981;font-size:0.85rem;margin-bottom:20px;"></div>

    <!-- ── Targeted delete ── -->
    <div class="section-label">Delete logs for one athlete + program</div>
    <div class="config">
      <label>Athlete Display Name</label>
      <input id="athleteName" placeholder="Jane Smith" />
      <label>Program Name</label>
      <input id="programName" placeholder="8 Week Program" />
      <button class="btn btn-red" id="btnTargeted" onclick="runTargeted()">Delete Workout Logs</button>
    </div>

    <hr class="divider" />

    <!-- ── Full reset ── -->
    <div class="section-label">⚠️ Full Reset — wipes everything</div>
    <div class="danger-box">
      <p style="color:rgba(239,68,68,0.8);font-size:0.88rem;margin-bottom:16px;">
        Deletes <strong>all programs</strong>, <strong>all workout logs</strong>, and clears
        <strong>all program assignments</strong> from every athlete account. Cannot be undone.
      </p>
      <button class="btn btn-amber" id="btnReset" onclick="runFullReset()">🔥 Full Reset</button>
    </div>
  </div>

  <div class="log" id="log"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const firebaseConfig = window.CoachSyncFirebaseConfig;
  if (!firebaseConfig) {
    throw new Error('Missing Firebase config. Create firebase-config.js from firebase-config.example.js.');
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  function log(msg, cls='info') {
    const el = document.getElementById('log');
    el.style.display = 'block';
    el.innerHTML += `<div class="${cls}">${msg}</div>`;
    el.scrollTop = el.scrollHeight;
  }

  function clearLog() {
    const el = document.getElementById('log');
    el.innerHTML = '';
    el.style.display = 'block';
  }

  async function deleteCollection(collName) {
    const result = { deleted: 0, errors: 0, readError: null };
    try {
      let snap;
      do {
        snap = await db.collection(collName).limit(400).get();
        log(`  Found ${snap.size} docs in ${collName}`);
        for (const doc of snap.docs) {
          try {
            await doc.ref.delete();
            result.deleted++;
          } catch(e) {
            result.errors++;
            log(`  ✗ Could not delete ${doc.id}: ${e.message}`, 'err');
          }
        }
      } while (snap.size === 400);
    } catch(e) {
      result.errors++;
      result.readError = e;
      log(`  ✗ Error reading ${collName}: ${e.message}`, 'err');
    }
    return result;
  }

  // ── Targeted: one athlete + program ──
  async function runTargeted() {
    const athleteName = document.getElementById('athleteName').value.trim();
    const programName = document.getElementById('programName').value.trim();
    if (!athleteName || !programName) { alert('Fill in both fields.'); return; }

    const btn = document.getElementById('btnTargeted');
    btn.disabled = true;
    clearLog();
    log(`Looking for athlete: "${athleteName}"…`);

    const usersSnap = await db.collection('users').where('displayName', '==', athleteName).get();
    if (usersSnap.empty) {
      log(`No user found with displayName "${athleteName}".`, 'err');
      btn.disabled = false; return;
    }
    const athleteId = usersSnap.docs[0].id;
    log(`Found athlete: ${athleteId}`, 'ok');

    const logsSnap = await db.collection('workoutLogs')
      .where('athleteId', '==', athleteId)
      .where('programName', '==', programName)
      .get();

    if (logsSnap.empty) {
      log(`No workoutLogs found for "${athleteName}" / "${programName}".`, 'info');
      btn.disabled = false; return;
    }

    if (!confirm(`Delete ${logsSnap.size} workoutLog(s) for "${athleteName}" / "${programName}"? Irreversible.`)) {
      log('Cancelled.', 'info'); btn.disabled = false; return;
    }

    let deleted = 0;
    let failed = 0;
    for (const doc of logsSnap.docs) {
      try {
        await db.collection('workoutLogs').doc(doc.id).delete();
        log(`Deleted ${++deleted}/${logsSnap.size}: ${doc.id}`, 'ok');
      } catch(e) {
        failed++;
        log(`Failed ${doc.id}: ${e.message}`, 'err');
      }
    }
    log(failed ? `Finished with errors: ${deleted} deleted, ${failed} failed.` : `✓ Done. ${deleted} log(s) deleted.`, failed ? 'warn' : 'ok');
    btn.disabled = false;
  }

  // ── Full reset ──
  async function runFullReset() {
    if (!confirm('FULL RESET: Delete ALL programs, ALL workout logs, and clear ALL athlete assignments?\n\nThis cannot be undone.')) return;
    if (!confirm('Are you absolutely sure? This wipes everything.')) return;

    const btnReset    = document.getElementById('btnReset');
    const btnTargeted = document.getElementById('btnTargeted');
    btnReset.disabled = true;
    btnTargeted.disabled = true;
    clearLog();
    log('Starting full reset…', 'warn');

    // 1. Delete all programs
    log('Deleting programs collection…', 'warn');
    const progResult = await deleteCollection('programs');
    log(`${progResult.errors ? '⚠' : '✓'} Deleted ${progResult.deleted} program(s).`, progResult.errors ? 'warn' : 'ok');

    // 2. Delete all workout logs
    log('Deleting workoutLogs collection…', 'warn');
    const logResult = await deleteCollection('workoutLogs');
    log(`${logResult.errors ? '⚠' : '✓'} Deleted ${logResult.deleted} workout log(s).`, logResult.errors ? 'warn' : 'ok');

    // 3. Clear program assignments from all athlete accounts
    log('Clearing athlete program assignments…', 'warn');
    const athleteSnap = await db.collection('users').get();
    log(`  Found ${athleteSnap.size} total user(s)`);
    let cleared = 0;
    let athletes = 0;
    let clearErrors = 0;
    for (const doc of athleteSnap.docs) {
      const data = doc.data();
      if (data.role === 'trainer') { log(`  Skipping trainer: ${data.email || doc.id}`); continue; }
      athletes++;
      const patch = { assignedPrograms: [], sessionsCompleted: 0 };
      if (data.assignedProgram)   patch.assignedProgram   = firebase.firestore.FieldValue.delete();
      if (data.programStartDates) patch.programStartDates = firebase.firestore.FieldValue.delete();
      if (data.programStartDate)  patch.programStartDate  = firebase.firestore.FieldValue.delete();
      if (data.lastWorkout)       patch.lastWorkout       = firebase.firestore.FieldValue.delete();
      try {
        await doc.ref.update(patch);
        log(`  ✓ Cleared: ${data.displayName || data.email || doc.id}`, 'ok');
        cleared++;
      } catch(e) {
        clearErrors++;
        log(`  ✗ Failed to clear ${doc.id}: ${e.message}`, 'err');
      }
    }
    log(`${clearErrors ? '⚠' : '✓'} Cleared ${cleared}/${athletes} athlete account(s).`, clearErrors ? 'warn' : 'ok');

    const totalErrors = progResult.errors + logResult.errors + clearErrors;
    if (totalErrors) {
      log(`⚠ Full reset finished with ${totalErrors} error(s). Some data may remain.`, 'err');
    } else {
      log('🔥 Full reset complete. Everything is wiped.', 'warn');
    }

    btnReset.disabled    = false;
    btnTargeted.disabled = false;
  }

  async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const status   = document.getElementById('loginStatus');
    if (!email || !password) { status.textContent = 'Enter email and password.'; return; }
    document.getElementById('loginBtn').disabled = true;
    status.textContent = 'Signing in…';
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch(e) {
      status.style.color = '#ef4444';
      status.textContent = e.message;
      document.getElementById('loginBtn').disabled = false;
    }
  }

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('mainSection').style.display  = 'block';
      document.getElementById('signedInAs').textContent     = '✓ Signed in as ' + (user.email || user.uid);
    }
  });
</script>
<script src="theme.js"></script>
</body>
</html>
