<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C1C1C" />
  <title>Settings — CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1C1C1C 0%, #114084 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid rgba(131,183,222,0.15);
      background: rgba(28,28,28,0.6);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { border-color: #3566AB; color: #3566AB; }
    .btn-logout {
      background: none; border: 1px solid rgba(239,68,68,0.4);
      color: rgba(239,68,68,0.8); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }

    .page-header { padding: 36px 0 24px; }
    .page-header h1 {
      font-size: 1.8rem; font-weight: 800;
      background: linear-gradient(135deg, #3566AB, #83B7DE);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
    }

    .section-label {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: rgba(255,255,255,0.35); margin-bottom: 14px;
    }

    .settings-card {
      background: rgba(17,64,132,0.85); border: 1px solid rgba(131,183,222,0.2);
      border-radius: 15px; padding: 24px 28px; margin-bottom: 20px;
    }

    /* Trainer code */
    .code-row {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }
    .code-left { display: flex; align-items: center; gap: 16px; }
    .code-icon {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      background: rgba(53,102,171,0.12); border: 1px solid rgba(53,102,171,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #3566AB;
    }
    .code-label { color: rgba(255,255,255,0.4); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .code-value {
      font-size: 1.6rem; font-weight: 800; letter-spacing: 4px; color: #3566AB;
      font-family: 'Courier New', monospace;
    }
    .code-hint { color: rgba(255,255,255,0.35); font-size: 0.78rem; margin-top: 3px; }
    .btn-copy {
      background: rgba(53,102,171,0.12); border: 1px solid rgba(53,102,171,0.35);
      color: #3566AB; font-weight: 700; font-size: 0.85rem;
      padding: 9px 22px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    }
    .btn-copy:hover { background: rgba(53,102,171,0.22); border-color: #3566AB; }

    /* Profile */
    .profile-row { display: flex; align-items: center; gap: 16px; }
    .profile-avatar {
      width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #3566AB, #83B7DE);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: 800; color: white;
    }
    .profile-name { font-size: 1.05rem; font-weight: 700; color: rgba(255,255,255,0.9); }
    .profile-email { font-size: 0.85rem; color: rgba(255,255,255,0.4); margin-top: 2px; }

    /* Logo upload */
    .logo-upload-area {
      border: 2px dashed rgba(131,183,222,0.3); border-radius: 14px;
      padding: 28px; text-align: center; transition: all 0.2s; cursor: pointer;
      background: rgba(53,102,171,0.04);
    }
    .logo-upload-area:hover, .logo-upload-area.dragover {
      border-color: #3566AB; background: rgba(53,102,171,0.09);
    }
    .logo-preview {
      max-width: 220px; max-height: 110px; object-fit: contain;
      border-radius: 10px; margin-bottom: 14px; display: none;
    }
    .logo-placeholder-icon { font-size: 2.4rem; color: rgba(131,183,222,0.4); margin-bottom: 10px; }
    .logo-upload-hint { color: rgba(255,255,255,0.35); font-size: 0.82rem; margin: 0; }
    .logo-upload-hint strong { color: #83B7DE; }
    #logoFileInput { display: none; }
    .logo-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-upload-select {
      background: rgba(53,102,171,0.12); border: 1px solid rgba(53,102,171,0.35);
      color: #3566AB; font-weight: 700; font-size: 0.85rem;
      padding: 9px 20px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .btn-upload-select:hover { background: rgba(53,102,171,0.22); border-color: #3566AB; }
    .btn-save-logo {
      background: #3566AB; border: none; color: white; font-weight: 700; font-size: 0.85rem;
      padding: 9px 22px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: none; align-items: center; gap: 7px;
    }
    .btn-save-logo:hover { background: #1677c2; }
    .btn-save-logo:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-remove-logo {
      background: none; border: 1px solid rgba(239,68,68,0.35); color: rgba(239,68,68,0.7);
      font-weight: 700; font-size: 0.82rem; padding: 9px 18px; border-radius: 20px;
      cursor: pointer; transition: all 0.2s; display: none; align-items: center; gap: 6px;
    }
    .btn-remove-logo:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.07); }
    .logo-status { font-size: 0.82rem; margin-top: 10px; min-height: 20px; }
    .upload-progress-bar {
      height: 4px; border-radius: 4px; background: rgba(255,255,255,0.08);
      margin-top: 12px; overflow: hidden; display: none;
    }
    .upload-progress-fill { height: 100%; background: #3566AB; width: 0%; transition: width 0.3s; border-radius: 4px; }

    .loading-overlay {
      position: fixed; inset: 0; background: linear-gradient(135deg, #1C1C1C, #114084);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 1.1rem; color: rgba(255,255,255,0.5); gap: 12px;
    }

    @media (max-width: 768px) {
      .top-nav { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <i class="fa-solid fa-spinner fa-spin"></i> Loading…
</div>

<nav class="top-nav">
  <div class="nav-brand">
    <img src="CoachSyncLogo.png" alt="CoachSync" style="height:72px;">
  </div>
  <div class="nav-right">
    <a href="trainer-dashboard.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
    <button class="btn-logout" onclick="doSignOut()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>Sign Out
    </button>
  </div>
</nav>

<div class="container" style="max-width:760px;">
  <div class="page-header">
    <h1><i class="fa-solid fa-gear me-2" style="font-size:1.5rem;"></i>Settings</h1>
  </div>

  <!-- Profile -->
  <p class="section-label">Profile</p>
  <div class="settings-card">
    <div class="profile-row">
      <div class="profile-avatar" id="profileInitial">—</div>
      <div>
        <div class="profile-name" id="profileName">—</div>
        <div class="profile-email" id="profileEmail">—</div>
      </div>
    </div>
  </div>

  <!-- Trainer Branding -->
  <p class="section-label">Branding</p>
  <div class="settings-card">
    <div style="display:flex; align-items:center; gap:14px; margin-bottom:18px;">
      <div class="code-icon"><i class="fa-solid fa-image"></i></div>
      <div>
        <div style="font-size:1rem; font-weight:700; color:rgba(255,255,255,0.9);">Trainer Logo</div>
        <div style="font-size:0.82rem; color:rgba(255,255,255,0.4); margin-top:2px;">Displayed on your athletes' home page when they sign in.</div>
      </div>
    </div>

    <input type="file" id="logoFileInput" accept="image/png,image/jpeg,image/svg+xml,image/webp" />

    <div class="logo-upload-area" id="logoDropZone" onclick="document.getElementById('logoFileInput').click()">
      <img id="logoPreview" class="logo-preview" alt="Logo preview" />
      <div id="logoPlaceholder">
        <div class="logo-placeholder-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <p class="logo-upload-hint">
          <strong>Click to upload</strong> or drag &amp; drop<br>
          PNG, JPG, SVG or WEBP · max 2 MB
        </p>
      </div>
    </div>

    <div class="upload-progress-bar" id="uploadProgressBar">
      <div class="upload-progress-fill" id="uploadProgressFill"></div>
    </div>

    <div class="logo-actions">
      <button class="btn-upload-select" onclick="document.getElementById('logoFileInput').click()">
        <i class="fa-solid fa-folder-open"></i> Choose File
      </button>
      <button class="btn-save-logo" id="btnSaveLogo" onclick="saveLogo()">
        <i class="fa-solid fa-floppy-disk"></i> Save Logo
      </button>
      <button class="btn-remove-logo" id="btnRemoveLogo" onclick="removeLogo()">
        <i class="fa-solid fa-trash"></i> Remove
      </button>
    </div>
    <div class="logo-status" id="logoStatus"></div>
  </div>

  <!-- Trainer code -->
  <p class="section-label">Trainer Code</p>
  <div class="settings-card">
    <div class="code-row">
      <div class="code-left">
        <div class="code-icon"><i class="fa-solid fa-id-badge"></i></div>
        <div>
          <div class="code-label">Your Unique Code</div>
          <div class="code-value" id="trainerCodeDisplay">—</div>
          <div class="code-hint">Share this with athletes so they can connect to you.</div>
        </div>
      </div>
      <button class="btn-copy" id="btnCopy" onclick="copyCode()">
        <i class="fa-solid fa-copy"></i> Copy Code
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const firebaseConfig = window.CoachSyncFirebaseConfig;
  if (!firebaseConfig) {
    throw new Error('Missing Firebase config. Create firebase-config.js from firebase-config.example.js.');
  }
  firebase.initializeApp(firebaseConfig);
  const auth    = firebase.auth();
  const db      = firebase.firestore();

  let trainerCode = '';
  let currentUserId = '';
  let pendingLogoFile = null;

  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'index.html'; return; }

    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists || snap.data().role !== 'trainer') {
      window.location.href = 'index.html'; return;
    }

    currentUserId = user.uid;
    const data = snap.data();
    const name = data.displayName || user.displayName || 'Trainer';

    document.getElementById('profileName').textContent = name;
    document.getElementById('profileEmail').textContent = user.email;
    document.getElementById('profileInitial').textContent = name.charAt(0).toUpperCase();

    if (data.trainerCode) {
      trainerCode = data.trainerCode;
    } else {
      trainerCode = await generateUniqueCode();
      await db.collection('users').doc(user.uid).update({ trainerCode });
    }
    document.getElementById('trainerCodeDisplay').textContent = trainerCode;

    // Load existing logo
    if (data.logoUrl) {
      showLogoPreview(data.logoUrl);
    }

    document.getElementById('loadingOverlay').style.display = 'none';
  });

  // ── Logo upload UI ──────────────────────────────────────────────────
  const logoInput   = document.getElementById('logoFileInput');
  const dropZone    = document.getElementById('logoDropZone');
  const logoPreview = document.getElementById('logoPreview');
  const logoHolder  = document.getElementById('logoPlaceholder');
  const btnSave     = document.getElementById('btnSaveLogo');
  const btnRemove   = document.getElementById('btnRemoveLogo');
  const logoStatus  = document.getElementById('logoStatus');

  logoInput.addEventListener('change', e => {
    if (e.target.files[0]) handleLogoFile(e.target.files[0]);
  });

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) handleLogoFile(file);
  });

  function handleLogoFile(file) {
    if (!['image/png','image/jpeg','image/svg+xml','image/webp'].includes(file.type)) {
      setLogoStatus('Please choose a PNG, JPG, SVG, or WEBP image.', 'error'); return;
    }
    if (file.size > 2 * 1024 * 1024) {
      setLogoStatus('File is too large — max 2 MB.', 'error'); return;
    }
    pendingLogoFile = file;
    const reader = new FileReader();
    reader.onload = ev => showLogoPreview(ev.target.result, true);
    reader.readAsDataURL(file);
  }

  function showLogoPreview(src, isPending = false) {
    logoPreview.src = src;
    logoPreview.style.display = 'block';
    logoHolder.style.display  = 'none';
    if (isPending) {
      btnSave.style.display   = 'inline-flex';
      setLogoStatus('Logo ready — click Save to store it.', 'info');
    } else {
      btnSave.style.display   = 'none';
      setLogoStatus('Logo is live on your athletes\' home page.', 'success');
    }
    btnRemove.style.display = 'inline-flex';
  }

  function setLogoStatus(msg, type) {
    const colors = { info: '#83B7DE', success: '#3566AB', error: '#ef4444' };
    logoStatus.style.color = colors[type] || '#fff';
    logoStatus.textContent = msg;
  }

  // Resize + compress image to a JPEG data URL small enough for Firestore (<900 KB)
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const MAX_W = 600, MAX_H = 300;
        let w = img.width, h = img.height;
        if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
        if (h > MAX_H) { w = Math.round(w * MAX_H / h); h = MAX_H; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function saveLogo() {
    if (!pendingLogoFile || !currentUserId) return;
    btnSave.disabled = true;
    btnSave.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';
    setLogoStatus('', '');

    const bar  = document.getElementById('uploadProgressBar');
    const fill = document.getElementById('uploadProgressFill');
    bar.style.display = 'block';
    fill.style.width  = '40%';

    try {
      const dataUrl = await compressImage(pendingLogoFile);
      fill.style.width = '80%';

      await db.collection('users').doc(currentUserId).update({ logoUrl: dataUrl });

      fill.style.width = '100%';
      setTimeout(() => { bar.style.display = 'none'; fill.style.width = '0%'; }, 400);

      // Update the preview to the compressed version
      logoPreview.src = dataUrl;
      if (window.setCoachSyncFavicon) window.setCoachSyncFavicon(dataUrl);
      pendingLogoFile = null;
      btnSave.style.display = 'none';
      btnSave.disabled = false;
      btnSave.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Logo';
      setLogoStatus('Logo saved — athletes will see it on their home page.', 'success');
    } catch(err) {
      bar.style.display = 'none';
      fill.style.width  = '0%';
      btnSave.disabled  = false;
      btnSave.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Logo';
      setLogoStatus('Save failed: ' + err.message, 'error');
    }
  }

  async function removeLogo() {
    if (!currentUserId) return;
    if (!confirm('Remove your trainer logo? Athletes will see the CoachSync default instead.')) return;

    try {
      await db.collection('users').doc(currentUserId).update({ logoUrl: firebase.firestore.FieldValue.delete() });

      logoPreview.src           = '';
      logoPreview.style.display = 'none';
      logoHolder.style.display  = 'block';
      btnSave.style.display     = 'none';
      btnRemove.style.display   = 'none';
      if (window.resetCoachSyncFavicon) window.resetCoachSyncFavicon();
      pendingLogoFile = null;
      setLogoStatus('Logo removed.', 'info');
    } catch(err) {
      setLogoStatus('Could not remove logo: ' + err.message, 'error');
    }
  }

  async function generateUniqueCode() {
    let code, exists;
    do {
      code = 'CS-' + Math.random().toString(36).substring(2, 8).toUpperCase();
      const snap = await db.collection('users').where('trainerCode', '==', code).get();
      exists = !snap.empty;
    } while (exists);
    return code;
  }

  function copyCode() {
    navigator.clipboard.writeText(trainerCode).then(() => {
      const btn = document.getElementById('btnCopy');
      btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Copied!';
      setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy Code'; }, 2000);
    });
  }

  async function doSignOut() {
    await auth.signOut();
    window.location.href = 'index.html';
  }
</script>
<script src="theme.js"></script>
</body>
</html>
