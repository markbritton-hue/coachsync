<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>My Athletes — CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }

    /* ── Nav ── */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid rgba(80,184,240,0.15);
      background: rgba(15,23,42,0.6);
    }
    .nav-brand {
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      display: flex; align-items: center; gap: 10px; text-decoration: none;
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { border-color: #50b8f0; color: #50b8f0; background: rgba(80,184,240,0.08); }
    .btn-logout {
      background: none; border: 1px solid rgba(239,68,68,0.4);
      color: rgba(239,68,68,0.8); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }

    /* ── Page header ── */
    .page-header {
      padding: 40px 0 28px;
      display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .page-header h1 {
      font-size: 1.8rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
    }
    .page-header p { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin: 4px 0 0; }

    /* ── Invite code card ── */
    .invite-card {
      background: rgba(30,41,59,0.8);
      border: 1px solid rgba(80,184,240,0.25);
      border-radius: 15px; padding: 24px 28px;
      margin-bottom: 32px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .invite-card-left { display: flex; align-items: center; gap: 16px; }
    .invite-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: rgba(80,184,240,0.15); border: 1px solid rgba(80,184,240,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: #50b8f0; flex-shrink: 0;
    }
    .invite-label { color: rgba(255,255,255,0.5); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .invite-code {
      font-size: 1.6rem; font-weight: 800; letter-spacing: 4px;
      color: #50b8f0; font-family: 'Courier New', monospace;
    }
    .invite-hint { color: rgba(255,255,255,0.4); font-size: 0.82rem; margin-top: 4px; }
    .btn-copy {
      background: rgba(80,184,240,0.15); border: 1px solid rgba(80,184,240,0.35);
      color: #50b8f0; font-weight: 600; padding: 10px 20px; border-radius: 25px;
      cursor: pointer; transition: all 0.2s; font-size: 0.9rem;
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    }
    .btn-copy:hover { background: rgba(80,184,240,0.25); }
    .btn-copy:disabled { opacity: 0.6; cursor: not-allowed; }

    /* ── Search ── */
    .search-bar {
      background: rgba(15,23,42,0.7); border: 2px solid rgba(80,184,240,0.2);
      color: white; border-radius: 25px; padding: 11px 20px;
      width: 100%; max-width: 380px; font-size: 0.95rem; outline: none;
    }
    .search-bar:focus { border-color: #50b8f0; box-shadow: 0 0 0 3px rgba(80,184,240,0.12); }
    .search-bar::placeholder { color: rgba(255,255,255,0.3); }

    /* ── Athlete cards ── */
    .athletes-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px; margin-bottom: 48px;
    }
    .athlete-card {
      background: rgba(30,41,59,0.85); border: 1px solid rgba(30,143,224,0.2);
      border-radius: 15px; padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4); transition: all 0.3s ease;
      cursor: pointer;
    }
    .athlete-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.5); border-color: rgba(30,143,224,0.4); }
    .athlete-card-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
    .athlete-avatar {
      width: 52px; height: 52px; border-radius: 50%;
      background: linear-gradient(135deg, #1e8fe0, #50b8f0);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 800; color: white; flex-shrink: 0; text-transform: uppercase;
    }
    .athlete-name { font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.9); margin-bottom: 2px; }
    .athlete-email { font-size: 0.8rem; color: rgba(255,255,255,0.4); }
    .athlete-stats {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;
    }
    .stat-box {
      background: rgba(15,23,42,0.5); border: 1px solid rgba(30,143,224,0.15);
      border-radius: 8px; padding: 10px 12px; text-align: center;
    }
    .stat-value { font-size: 1.1rem; font-weight: 700; color: #1e8fe0; }
    .stat-label { font-size: 0.72rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

    .athlete-program {
      background: rgba(80,184,240,0.08); border: 1px solid rgba(80,184,240,0.2);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
    }
    .athlete-program-label { color: rgba(255,255,255,0.4); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
    .athlete-program-name { color: #50b8f0; font-weight: 700; font-size: 0.9rem; margin-bottom: 10px; }

    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .progress-week-label { font-size: 0.78rem; font-weight: 700; color: rgba(255,255,255,0.7); }
    .progress-pct-label  { font-size: 0.72rem; color: rgba(255,255,255,0.4); }
    .prog-bar-track { background: rgba(255,255,255,0.08); border-radius: 6px; height: 6px; overflow: hidden; }
    .prog-bar-fill  { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #1e8fe0, #50b8f0); transition: width 0.4s; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
      padding: 3px 10px; border-radius: 20px;
    }
    .status-active   { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.35); color: #10b981; }
    .status-inactive { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3);  color: #f59e0b; }
    .status-nostart  { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); }

    .last-workout-row { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
    .athlete-card-footer { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    /* ── Buttons ── */
    .btn-primary-app {
      background: #50b8f0; border: none; color: white; font-weight: 700;
      padding: 11px 24px; border-radius: 25px; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(80,184,240,0.3);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary-app:hover { background: #1070c0; transform: translateY(-2px); }
    .btn-assign {
      background: rgba(30,143,224,0.18); border: 1px solid rgba(30,143,224,0.5);
      color: #50b8f0; font-size: 0.85rem; font-weight: 700;
      padding: 9px 18px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
    }
    .btn-assign:hover { background: rgba(30,143,224,0.32); border-color: #50b8f0; }
    .btn-remove {
      background: none; border: 1px solid rgba(239,68,68,0.3);
      color: rgba(239,68,68,0.7); font-size: 0.82rem; font-weight: 600;
      padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
    }
    .btn-remove:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }
    .program-mini-card {
      background: rgba(15,23,42,0.5); border: 1px solid rgba(80,184,240,0.2);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .program-mini-card:hover {
      border-color: rgba(80,184,240,0.5); background: rgba(80,184,240,0.07);
    }
    .btn-remove-prog {
      background: none; border: none; color: rgba(239,68,68,0.45);
      font-size: 0.8rem; cursor: pointer; padding: 2px 5px; line-height: 1;
      transition: color 0.2s; flex-shrink: 0;
    }
    .btn-remove-prog:hover { color: #ef4444; }

    /* ── Empty / loading ── */
    .empty-state {
      grid-column: 1/-1; text-align: center; padding: 60px 20px;
    }
    .empty-state i { font-size: 3rem; color: rgba(30,143,224,0.25); margin-bottom: 16px; display: block; }
    .empty-state p { color: rgba(255,255,255,0.35); font-size: 0.95rem; }
    .loading-overlay {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 1.1rem; color: rgba(255,255,255,0.5); gap: 12px;
    }

    /* ── Assign modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.8); z-index: 9999;
      align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(80,184,240,0.3); border-radius: 20px;
      padding: 36px; width: 100%; max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }
    .modal-title {
      font-size: 1.3rem; font-weight: 800;
      background: linear-gradient(135deg, #50b8f0, #1e8fe0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px;
    }
    .field-label { color: rgba(255,255,255,0.6); font-size: 0.82rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: block; }
    .field-select {
      background: rgba(15,23,42,0.7); border: 2px solid rgba(80,184,240,0.25);
      color: white; border-radius: 8px; padding: 11px 14px;
      width: 100%; font-size: 0.95rem; margin-bottom: 20px; outline: none;
    }
    .field-select:focus { border-color: #50b8f0; }
    .field-select option { background: #1e293b; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
    .btn-cancel {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.6);
      font-weight: 600; padding: 10px 22px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-cancel:hover { border-color: rgba(255,255,255,0.4); color: white; }
    .btn-save {
      background: #50b8f0; border: none; color: white; font-weight: 700;
      padding: 10px 26px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(80,184,240,0.3);
    }
    .btn-save:hover { background: #1070c0; transform: translateY(-2px); }
    .btn-save:disabled { opacity: 0.6; transform: none; cursor: not-allowed; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid rgba(80,184,240,0.4);
      border-radius: 14px; padding: 14px 22px; z-index: 99999;
      display: none; align-items: center; gap: 10px;
      font-size: 0.9rem; color: rgba(255,255,255,0.85);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .toast.show { display: flex; }
    .toast.success { border-color: rgba(16,185,129,0.5); }
    .toast.error   { border-color: rgba(239,68,68,0.5); color: #ef4444; }

    /* ── Workout log summary on mini-card ── */
    .workout-log-row {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      margin-top: 8px; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .log-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.72rem; font-weight: 700; padding: 3px 9px; border-radius: 20px;
    }
    .log-pill-week { background: rgba(80,184,240,0.12); border: 1px solid rgba(80,184,240,0.25); color: #50b8f0; }
    .log-pill-progress { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #10b981; }
    .log-pill-rpe { border: 1px solid; }
    .log-pill-rpe.easy   { background: rgba(16,185,129,0.12); border-color: rgba(16,185,129,0.3); color: #10b981; }
    .log-pill-rpe.medium { background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.3); color: #f59e0b; }
    .log-pill-rpe.hard   { background: rgba(239,68,68,0.12);  border-color: rgba(239,68,68,0.3);  color: #ef4444; }
    .log-view-btn {
      margin-left: auto; background: none; border: none;
      color: rgba(80,184,240,0.5); font-size: 0.72rem; cursor: pointer;
      padding: 2px 6px; border-radius: 6px; transition: color 0.2s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .log-view-btn:hover { color: #50b8f0; }

    /* ── Workout detail modal ── */
    .detail-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.82); z-index: 10000;
      align-items: flex-end; justify-content: center; padding: 0;
    }
    .detail-modal-overlay.open { display: flex; }
    .detail-modal-box {
      background: linear-gradient(160deg, #1e293b, #0f172a);
      border: 1px solid rgba(80,184,240,0.25); border-radius: 22px 22px 0 0;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
      padding: 32px 28px 40px; box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform: translateY(60px); opacity:0; } to { transform: translateY(0); opacity:1; } }
    .detail-handle {
      width: 40px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.15); margin: 0 auto 24px;
    }
    .detail-header-row { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .detail-title { font-size: 1.2rem; font-weight: 800; color: white; }
    .detail-subtitle { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-top: 3px; }
    .detail-close {
      background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.5);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s;
    }
    .detail-close:hover { background: rgba(255,255,255,0.15); color: white; }
    .detail-meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .detail-meta-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.78rem; font-weight: 700; padding: 5px 12px; border-radius: 20px;
    }
    .rpe-display {
      background: rgba(30,41,59,0.8); border: 1px solid rgba(80,184,240,0.2);
      border-radius: 14px; padding: 18px 20px; margin-bottom: 20px;
    }
    .rpe-display-label { font-size: 0.72rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .rpe-blocks { display: flex; gap: 5px; }
    .rpe-block {
      flex: 1; height: 28px; border-radius: 6px;
      background: rgba(255,255,255,0.06); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.68rem; font-weight: 700; color: transparent;
    }
    .rpe-block.lit { color: white; }
    .rpe-block.lit.easy   { background: #10b981; }
    .rpe-block.lit.medium { background: #f59e0b; }
    .rpe-block.lit.hard   { background: #ef4444; }
    .rpe-score-line { margin-top: 8px; font-size: 0.82rem; color: rgba(255,255,255,0.5); }
    .ex-list { display: flex; flex-direction: column; gap: 8px; }
    .ex-list-item {
      display: flex; align-items: center; gap: 12px;
      background: rgba(15,23,42,0.5); border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px; padding: 12px 14px;
    }
    .ex-list-item.done { border-color: rgba(16,185,129,0.25); }
    .ex-check {
      width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
    }
    .ex-check.done { background: rgba(16,185,129,0.2); color: #10b981; border: 1px solid rgba(16,185,129,0.4); }
    .ex-check.pending { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.1); }
    .ex-list-name { font-size: 0.88rem; font-weight: 600; color: rgba(255,255,255,0.85); }
    .ex-list-name.done { color: rgba(16,185,129,0.9); }

    @media (max-width: 768px) {
      .top-nav { padding: 14px 16px; }
      .invite-card { flex-direction: column; align-items: flex-start; }
      .page-header { flex-direction: column; align-items: flex-start; }
    }
    @media (max-width: 575px) {
      .athlete-stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <i class="fa-solid fa-spinner fa-spin"></i> Loading…
</div>

<!-- Nav -->
<nav class="top-nav">
  <a href="trainer-dashboard.html" class="nav-brand">
    <img src="CoachSyncLogo.png" alt="CoachSync" style="height:72px;">
  </a>
  <div class="nav-right">
    <a href="trainer-dashboard.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
    <button class="btn-logout" onclick="doSignOut()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>Sign Out
    </button>
  </div>
</nav>

<div class="container" style="max-width:1100px;">

  <div class="page-header">
    <div>
      <h1><i class="fa-solid fa-users me-2" style="font-size:1.5rem;"></i>My Athletes</h1>
      <p id="athleteCount">Loading athletes…</p>
    </div>
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <input type="text" class="search-bar" id="searchBar" placeholder="🔍  Search athletes…" oninput="renderAthletes()" />
    </div>
  </div>

  <!-- Athletes grid -->
  <div class="athletes-grid" id="athletesGrid">
    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fa-solid fa-users"></i>
      <p>No athletes yet.<br>Add an athlete above using their email address.</p>
    </div>
  </div>
</div>

<!-- Assign Program Modal -->
<div class="modal-overlay" id="assignModal">
  <div class="modal-box">
    <h2 class="modal-title"><i class="fa-solid fa-clipboard-list me-2"></i>Assign Program</h2>
    <p style="color:rgba(255,255,255,0.5); font-size:0.88rem; margin-bottom:20px;">
      Assigning to: <strong id="assignAthleteNameLabel" style="color:rgba(255,255,255,0.8);"></strong>
    </p>
    <label class="field-label">Add an Existing Program</label>
    <select class="field-select" id="programSelect"></select>
    <div style="text-align:center; margin: -6px 0 20px; color:rgba(255,255,255,0.3); font-size:0.82rem;">— or —</div>
    <a id="btnCreateCustom" href="#" class="btn-assign" style="display:flex;justify-content:center;align-items:center;gap:8px;padding:12px;border-radius:12px;font-size:0.9rem;margin-bottom:4px;">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Create Custom Program for This Athlete
    </a>
    <div class="modal-footer" style="margin-top:20px;">
      <button class="btn-cancel" onclick="closeAssignModal()">Cancel</button>
      <button class="btn-save" id="btnAssign" onclick="doAssign()">
        <i class="fa-solid fa-check me-1"></i> Assign
      </button>
    </div>
  </div>
</div>

<!-- Workout Detail Modal -->
<div class="detail-modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
  <div class="detail-modal-box">
    <div class="detail-handle"></div>
    <div class="detail-header-row">
      <div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-subtitle" id="detailSubtitle"></div>
      </div>
      <button class="detail-close" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="detail-meta-row" id="detailMeta"></div>
    <div class="rpe-display" id="detailRpeSection" style="display:none;">
      <div class="rpe-display-label"><i class="fa-solid fa-fire-flame-curved me-1"></i>Effort Rating (RPE)</div>
      <div class="rpe-blocks" id="detailRpeBlocks"></div>
      <div class="rpe-score-line" id="detailRpeLabel"></div>
    </div>
    <div style="font-size:0.72rem;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;" id="detailExLabel"></div>
    <div class="ex-list" id="detailExList"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDnaS5J_-KkmFZcE3FtjjxV54cZkbWcop8",
    authDomain: "coachsync-7e07e.firebaseapp.com",
    projectId: "coachsync-7e07e",
    storageBucket: "coachsync-7e07e.firebasestorage.app",
    messagingSenderId: "774513797996",
    appId: "1:774513797996:web:e38f47773c5b487982e149"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUser  = null;
  let allAthletes  = [];
  let allPrograms  = [];
  let latestLogs   = {};   // athleteId → { programName → workoutLog doc }
  let assigningUid = null;

  function computeWeekDay(startDateMs, daysPerWeek) {
    const msPerDay  = 86400000;
    const startDay  = Math.floor(startDateMs / msPerDay);
    const todayDay  = Math.floor(Date.now()  / msPerDay);
    const dayIndex  = Math.max(0, todayDay - startDay);
    return { week: Math.floor(dayIndex / daysPerWeek) + 1, day: (dayIndex % daysPerWeek) + 1 };
  }

  // ── Auth guard ──
  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    try {
      const snap = await db.collection('users').doc(user.uid).get();
      if (!snap.exists) { window.location.href = 'index.html'; return; }
      if (snap.data().role !== 'trainer') { window.location.href = 'athlete-dashboard.html'; return; }
      currentUser = user;
      loadAthletes();
      loadPrograms();
    } catch(e) {
      console.error('Auth load error:', e);
      document.getElementById('loadingOverlay').style.display = 'none';
    }
  });

  // ── Load athletes ──
  function loadAthletes() {
    db.collection('users')
      .where('trainerId', '==', currentUser.uid)
      .onSnapshot(async snap => {
        allAthletes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        await loadLatestLogs();
        renderAthletes();
        document.getElementById('loadingOverlay').style.display = 'none';
      }, err => {
        console.error('Athletes query error:', err);
        document.getElementById('loadingOverlay').innerHTML = '<span style="color:#ef4444;">Error: ' + err.message + '</span>';
      });
  }

  // ── Load most recent workoutLog per athlete/program ──
  async function loadLatestLogs() {
    if (allAthletes.length === 0) return;
    const ids = allAthletes.map(a => a.id);
    // Firestore 'in' supports up to 30 values; chunk if needed
    const chunks = [];
    for (let i = 0; i < ids.length; i += 30) chunks.push(ids.slice(i, i + 30));
    const allDocs = [];
    await Promise.all(chunks.map(chunk =>
      db.collection('workoutLogs')
        .where('athleteId', 'in', chunk)
        .get()
        .then(s => s.docs.forEach(d => allDocs.push({ id: d.id, ...d.data() })))
        .catch(e => console.warn('workoutLogs query:', e))
    ));
    // Sort by updatedAt desc so first-seen wins below
    allDocs.sort((a, b) => {
      const at = a.updatedAt?.seconds || 0;
      const bt = b.updatedAt?.seconds || 0;
      return bt - at;
    });
    // Keep the latest log per athleteId+programName pair
    latestLogs = {};
    allDocs.forEach(log => {
      const key = log.athleteId;
      if (!latestLogs[key]) latestLogs[key] = {};
      const prog = log.programName || '__unknown__';
      if (!latestLogs[key][prog]) latestLogs[key][prog] = log;
    });
  }

  // ── Load programs for assign dropdown ──
  function loadPrograms() {
    db.collection('programs')
      .where('trainerId', '==', currentUser.uid)
      .onSnapshot(snap => {
        allPrograms = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      });
  }

  // ── Render athletes ──
  function renderAthletes() {
    const grid    = document.getElementById('athletesGrid');
    const empty   = document.getElementById('emptyState');
    const query   = document.getElementById('searchBar').value.toLowerCase();
    const filtered = allAthletes.filter(a =>
      !query ||
      (a.displayName || '').toLowerCase().includes(query) ||
      (a.email || '').toLowerCase().includes(query)
    );

    [...grid.querySelectorAll('.athlete-card')].forEach(c => c.remove());

    const count = allAthletes.length;
    document.getElementById('athleteCount').textContent =
      count === 0 ? 'No athletes connected yet.' :
      count === 1 ? '1 athlete connected' : count + ' athletes connected';

    if (filtered.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';

    filtered.forEach(a => {
      const assignedPrograms = a.assignedPrograms
        ? a.assignedPrograms
        : (a.assignedProgram ? [a.assignedProgram] : []);

      // ── Card shell ──
      const card = document.createElement('div');
      card.className = 'athlete-card';

      // ── Clickable top (navigates to detail) ──
      const top = document.createElement('div');
      top.style.cursor = 'pointer';
      top.addEventListener('click', () => window.location.href = 'athlete-detail.html?id=' + a.id);

      // Avatar + name
      const cardTop = document.createElement('div');
      cardTop.className = 'athlete-card-top';
      const avatar = document.createElement('div');
      avatar.className = 'athlete-avatar';
      avatar.textContent = getInitials(a.displayName || a.email || '?');
      const nameBlock = document.createElement('div');
      nameBlock.style.flex = '1';
      const nameEl = document.createElement('div');
      nameEl.className = 'athlete-name';
      nameEl.textContent = a.displayName || 'Unnamed';
      const emailEl = document.createElement('div');
      emailEl.className = 'athlete-email';
      emailEl.textContent = a.email || '';
      const chevron = document.createElement('i');
      chevron.className = 'fa-solid fa-chevron-right';
      chevron.style.cssText = 'color:rgba(255,255,255,0.2);font-size:0.8rem;';
      nameBlock.append(nameEl, emailEl);
      cardTop.append(avatar, nameBlock, chevron);

      // Stats
      const stats = document.createElement('div');
      stats.className = 'athlete-stats';
      const joinedDate = a.createdAt
        ? new Date(a.createdAt.seconds * 1000).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })
        : '—';
      stats.innerHTML = `
        <div class="stat-box"><div class="stat-value">${a.sessionsCompleted || 0}</div><div class="stat-label">Workouts</div></div>
        <div class="stat-box"><div class="stat-value">${joinedDate}</div><div class="stat-label">Joined</div></div>`;

      // Programs section
      const progSection = document.createElement('div');
      progSection.className = 'athlete-program';
      progSection.style.marginBottom = '0';
      const progLabel = document.createElement('div');
      progLabel.className = 'athlete-program-label';
      progLabel.style.marginBottom = '8px';
      progLabel.textContent = 'Programs';
      progSection.appendChild(progLabel);

      if (assignedPrograms.length === 0) {
        const none = document.createElement('div');
        none.style.cssText = 'color:rgba(255,255,255,0.3);font-size:0.85rem;padding:4px 0;';
        none.textContent = 'None assigned';
        progSection.appendChild(none);
      } else {
        assignedPrograms.forEach(pName => {
          const prog = allPrograms.find(p => p.name === pName);

          // Status badge — check per-program start date
          const perProgStart = (a.programStartDates && a.programStartDates[pName])
            || (assignedPrograms.length === 1 ? a.programStartDate : null);
          let badgeClass = 'status-nostart', badgeText = 'Not started', badgeIcon = 'fa-clock';
          if (perProgStart) {
            badgeClass = 'status-active'; badgeText = 'Started'; badgeIcon = 'fa-circle';
          }

          // Mini program card — clicking anywhere on it opens the edit page
          const miniCard = document.createElement('div');
          miniCard.className = 'program-mini-card';
          miniCard.style.cursor = 'pointer';
          miniCard.addEventListener('click', (e) => {
            e.stopPropagation();
            let url = 'programs.html?returnTo=my-athletes&editName=' + encodeURIComponent(pName);
            if (prog) url += '&editId=' + encodeURIComponent(prog.id);
            window.location.href = url;
          });

          // Top row: name + action buttons
          const miniTop = document.createElement('div');
          miniTop.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;';

          const nameSpan = document.createElement('div');
          nameSpan.className = 'athlete-program-name';
          nameSpan.style.margin = '0';
          nameSpan.textContent = pName;

          const actions = document.createElement('div');
          actions.style.cssText = 'display:flex;align-items:center;gap:6px;';

          const editBtn = document.createElement('button');
          editBtn.className = 'btn-remove-prog';
          editBtn.title = 'Edit program';
          editBtn.style.color = 'rgba(80,184,240,0.6)';
          editBtn.innerHTML = '<i class="fa-solid fa-pen"></i>';
          editBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            let url = 'programs.html?returnTo=my-athletes&editName=' + encodeURIComponent(pName);
            if (prog) url += '&editId=' + encodeURIComponent(prog.id);
            window.location.href = url;
          });

          const removeBtn = document.createElement('button');
          removeBtn.className = 'btn-remove-prog';
          removeBtn.title = 'Remove program';
          removeBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
          removeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeProgram(a.id, pName);
          });

          actions.append(editBtn, removeBtn);
          miniTop.append(nameSpan, actions);

          // Status badge row
          const badge = document.createElement('span');
          badge.className = 'status-badge ' + badgeClass;
          badge.innerHTML = `<i class="fa-solid ${badgeIcon}" style="font-size:6px;"></i> ${badgeText}`;

          const log = (latestLogs[a.id] || {})[pName];

          miniCard.append(miniTop, badge);

          // Workout log summary row
          if (log) {
            const logRow = document.createElement('div');
            logRow.className = 'workout-log-row';

            const weekPill = document.createElement('span');
            weekPill.className = 'log-pill log-pill-week';
            weekPill.innerHTML = `<i class="fa-solid fa-calendar-week"></i> Wk ${log.week}, Day ${log.day}`;
            logRow.appendChild(weekPill);

            if (log.totalExercises > 0) {
              const done = (log.completedExercises || []).length;
              const progPill = document.createElement('span');
              progPill.className = 'log-pill log-pill-progress';
              progPill.innerHTML = `<i class="fa-solid fa-check"></i> ${done}/${log.totalExercises} done`;
              logRow.appendChild(progPill);
            }

            if (log.rpe) {
              const rpeClass = log.rpe <= 6 ? 'easy' : log.rpe <= 9 ? 'medium' : 'hard';
              const rpePill = document.createElement('span');
              rpePill.className = `log-pill log-pill-rpe ${rpeClass}`;
              rpePill.innerHTML = `<i class="fa-solid fa-fire-flame-curved"></i> RPE ${log.rpe}`;
              logRow.appendChild(rpePill);
            }

            const viewBtn = document.createElement('button');
            viewBtn.className = 'log-view-btn';
            viewBtn.innerHTML = '<i class="fa-solid fa-chart-bar"></i> Details';
            viewBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              openDetailModal(a, pName, log);
            });
            logRow.appendChild(viewBtn);

            miniCard.appendChild(logRow);
          }

          progSection.appendChild(miniCard);
        });

        // Last workout
        if (a.lastWorkout) {
          const days = Math.floor((Date.now() - a.lastWorkout.seconds * 1000) / 86400000);
          const lbl  = days === 0 ? 'Today' : days === 1 ? 'Yesterday' : `${days} days ago`;
          const lwRow = document.createElement('div');
          lwRow.className = 'last-workout-row';
          lwRow.style.marginTop = '8px';
          lwRow.innerHTML = `<i class="fa-solid fa-dumbbell"></i> Last workout: ${lbl}`;
          progSection.appendChild(lwRow);
        }
      }

      top.append(cardTop, stats);

      // ── Footer: Assign button ──
      const footer = document.createElement('div');
      footer.className = 'athlete-card-footer';
      const assignBtn = document.createElement('button');
      assignBtn.className = 'btn-assign';
      assignBtn.innerHTML = '<i class="fa-solid fa-clipboard-list"></i> Assign a Program';
      assignBtn.addEventListener('click', () => openAssignModal(a.id, a.displayName || a.email));
      footer.appendChild(assignBtn);

      card.append(top, progSection, footer);
      grid.appendChild(card);
    });
  }

  // ── Assign program modal ──
  function openAssignModal(uid, name) {
    assigningUid = uid;
    document.getElementById('assignAthleteNameLabel').textContent = name || '';

    const athlete = allAthletes.find(a => a.id === uid);
    const current = athlete?.assignedPrograms || (athlete?.assignedProgram ? [athlete.assignedProgram] : []);

    // Only show programs not already assigned
    const available = allPrograms.filter(p => !current.includes(p.name));
    const sel = document.getElementById('programSelect');
    sel.innerHTML = '<option value="">— Select a program —</option>' +
      available.map(p => `<option value="${esc(p.name)}">${esc(p.name)} (${esc(p.difficulty)}, ${esc(p.duration)})</option>`).join('');

    // Wire custom program link
    document.getElementById('btnCreateCustom').href =
      `programs.html?athlete=${encodeURIComponent(uid)}&name=${encodeURIComponent(name)}`;

    document.getElementById('assignModal').classList.add('open');
  }

  function closeAssignModal() {
    document.getElementById('assignModal').classList.remove('open');
    assigningUid = null;
  }

  async function doAssign() {
    if (!assigningUid) return;
    const progName = document.getElementById('programSelect').value;
    if (!progName) { showToast('Please select a program.', 'error'); return; }
    const btn = document.getElementById('btnAssign');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>';
    try {
      await db.collection('users').doc(assigningUid).update({
        assignedPrograms: firebase.firestore.FieldValue.arrayUnion(progName)
      });
      showToast('Program assigned!', 'success');
      closeAssignModal();
    } catch(e) {
      showToast('Error: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-check me-1"></i> Assign';
    }
  }

  // ── Remove a single program from an athlete ──
  async function removeProgram(uid, progName) {
    try {
      await db.collection('users').doc(uid).update({
        assignedPrograms: firebase.firestore.FieldValue.arrayRemove(progName)
      });
      showToast(`"${progName}" removed.`, 'success');
    } catch(e) {
      showToast('Error removing program.', 'error');
    }
  }

  // ── Remove athlete ──


  // ── Helpers ──
  function getInitials(name) {
    const parts = name.trim().split(' ');
    return parts.length >= 2
      ? (parts[0][0] + parts[parts.length-1][0]).toUpperCase()
      : name.slice(0,2).toUpperCase();
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.className = 'toast show ' + type;
    t.innerHTML = (type === 'success'
      ? '<i class="fa-solid fa-circle-check" style="color:#10b981;"></i> '
      : '<i class="fa-solid fa-circle-exclamation"></i> ') + msg;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Workout detail modal ──
  const rpeLabels = {
    1:'Very easy', 2:'Easy', 3:'Moderate', 4:'Somewhat hard', 5:'Hard',
    6:'Hard+', 7:'Very hard', 8:'Very hard+', 9:'Extremely hard', 10:'Max effort'
  };

  function openDetailModal(athlete, progName, log) {
    document.getElementById('detailTitle').textContent = athlete.displayName || athlete.email || 'Athlete';
    document.getElementById('detailSubtitle').textContent = progName;

    // Meta pills
    const metaRow = document.getElementById('detailMeta');
    metaRow.innerHTML = '';
    const addMeta = (icon, text, cls) => {
      const pill = document.createElement('span');
      pill.className = 'detail-meta-pill ' + cls;
      pill.innerHTML = `<i class="fa-solid ${icon}"></i> ${text}`;
      metaRow.appendChild(pill);
    };
    addMeta('fa-calendar-week', `Week ${log.week}, Day ${log.day}`,
      'log-pill log-pill-week');
    if (log.date) {
      const d = new Date(log.date);
      const label = isNaN(d) ? log.date : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      addMeta('fa-clock', `Last logged: ${label}`, 'log-pill log-pill-week');
    }

    // RPE
    const rpeSection = document.getElementById('detailRpeSection');
    if (log.rpe) {
      rpeSection.style.display = 'block';
      const blocks = document.getElementById('detailRpeBlocks');
      blocks.innerHTML = '';
      for (let i = 1; i <= 10; i++) {
        const b = document.createElement('div');
        b.className = 'rpe-block';
        b.textContent = i;
        if (i <= log.rpe) {
          const cls = i <= 6 ? 'easy' : i <= 9 ? 'medium' : 'hard';
          b.classList.add('lit', cls);
        }
        blocks.appendChild(b);
      }
      const rpeClass = log.rpe <= 6 ? 'easy' : log.rpe <= 9 ? 'medium' : 'hard';
      const colors = { easy:'#10b981', medium:'#f59e0b', hard:'#ef4444' };
      document.getElementById('detailRpeLabel').innerHTML =
        `<span style="color:${colors[rpeClass]};font-weight:700;">${log.rpe}/10</span> — ${rpeLabels[log.rpe] || ''}`;
    } else {
      rpeSection.style.display = 'none';
    }

    // Exercises
    const exNames = log.exerciseNames || [];
    const completed = new Set(log.completedExercises || []);
    const exLabel = document.getElementById('detailExLabel');
    const exList  = document.getElementById('detailExList');
    exList.innerHTML = '';

    if (exNames.length > 0) {
      const doneCount = exNames.filter((_, i) => completed.has(String(i))).length;
      exLabel.textContent = `Exercises — ${doneCount} of ${exNames.length} completed`;
      exNames.forEach((name, i) => {
        const done = completed.has(String(i));
        const item = document.createElement('div');
        item.className = 'ex-list-item' + (done ? ' done' : '');
        const check = document.createElement('div');
        check.className = 'ex-check ' + (done ? 'done' : 'pending');
        check.innerHTML = done ? '<i class="fa-solid fa-check"></i>' : '<i class="fa-solid fa-minus"></i>';
        const namEl = document.createElement('div');
        namEl.className = 'ex-list-name' + (done ? ' done' : '');
        namEl.textContent = name;
        item.append(check, namEl);
        exList.appendChild(item);
      });
    } else {
      exLabel.textContent = '';
    }

    document.getElementById('detailModal').classList.add('open');
  }

  function closeDetailModal(e) {
    if (e && e.target !== document.getElementById('detailModal')) return;
    document.getElementById('detailModal').classList.remove('open');
  }

  async function doSignOut() { await auth.signOut(); window.location.href = 'index.html'; }

  document.getElementById('assignModal').addEventListener('click', function(e) {
    if (e.target === this) closeAssignModal();
  });
</script>
