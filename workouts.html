<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>My Workouts — CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid rgba(114,184,50,0.15);
      background: rgba(15,23,42,0.6);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-back {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { border-color: #72b832; color: #72b832; }
    .btn-logout {
      background: none; border: 1px solid rgba(239,68,68,0.4);
      color: rgba(239,68,68,0.8); font-size: 0.85rem; font-weight: 600;
      padding: 6px 16px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }

    .page-header { padding: 36px 0 20px; }
    .page-header h1 {
      font-size: 1.8rem; font-weight: 800;
      background: linear-gradient(135deg, #72b832, #a0d060);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
    }

    /* ── Main tabs (Today / History) ── */
    .main-tabs { display: flex; gap: 6px; margin-bottom: 24px; }
    .main-tab {
      background: none; border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.5); font-size: 0.9rem; font-weight: 600;
      padding: 9px 22px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .main-tab.active {
      background: rgba(114,184,50,0.15); border-color: rgba(114,184,50,0.5); color: #72b832;
    }
    .main-tab:hover:not(.active) { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }

    /* ── Program banner ── */
    .program-banner {
      background: rgba(30,41,59,0.85); border: 1px solid rgba(114,184,50,0.25);
      border-radius: 15px; padding: 20px 24px; margin-bottom: 22px;
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    }
    .program-banner-icon {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      background: rgba(114,184,50,0.12); border: 1px solid rgba(114,184,50,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; color: #72b832;
    }
    .program-banner-name { font-size: 1.05rem; font-weight: 700; color: #72b832; margin-bottom: 5px; }
    .program-banner-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .meta-pill {
      background: rgba(114,184,50,0.1); border: 1px solid rgba(114,184,50,0.2);
      border-radius: 20px; padding: 3px 11px; font-size: 0.76rem;
      color: rgba(255,255,255,0.6); display: inline-flex; align-items: center; gap: 5px;
    }

    /* ── Day tabs ── */
    .day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .day-tab {
      background: none; border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.45); font-size: 0.8rem; font-weight: 600;
      padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: all 0.2s;
    }
    .day-tab.active {
      background: rgba(114,184,50,0.12); border-color: rgba(114,184,50,0.4); color: #72b832;
    }
    .day-tab:hover:not(.active) { border-color: rgba(255,255,255,0.25); color: rgba(255,255,255,0.7); }

    /* ── Progress bar ── */
    .progress-section { margin-bottom: 20px; }
    .progress-label {
      display: flex; justify-content: space-between;
      font-size: 0.82rem; color: rgba(255,255,255,0.45); margin-bottom: 8px;
    }
    .progress-bar-track {
      background: rgba(255,255,255,0.08); border-radius: 10px; height: 8px; overflow: hidden;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #72b832, #a0d060);
      height: 100%; border-radius: 10px; transition: width 0.4s ease;
    }

    /* ── Exercise cards ── */
    .section-label {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: rgba(255,255,255,0.35); margin-bottom: 12px;
    }
    .exercise-card {
      background: rgba(30,41,59,0.85); border: 1px solid rgba(114,184,50,0.15);
      border-radius: 13px; padding: 16px 20px; margin-bottom: 10px; transition: all 0.2s;
    }
    .exercise-card.completed {
      border-color: rgba(114,184,50,0.4); background: rgba(114,184,50,0.06);
    }
    .exercise-card-top { display: flex; align-items: center; gap: 16px; }
    .exercise-checkbox {
      width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; cursor: pointer;
      border: 2px solid rgba(114,184,50,0.4); background: none;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; font-size: 0.9rem; color: transparent;
    }
    .exercise-card.completed .exercise-checkbox {
      background: #72b832; border-color: #72b832; color: white;
    }
    .exercise-info { flex: 1; }
    .exercise-name {
      font-size: 1rem; font-weight: 700; color: rgba(255,255,255,0.9); margin-bottom: 4px;
    }
    .exercise-card.completed .exercise-name {
      text-decoration: line-through; color: rgba(255,255,255,0.4);
    }
    .exercise-details { display: flex; flex-wrap: wrap; gap: 10px; }
    .exercise-details span {
      font-size: 0.8rem; color: rgba(255,255,255,0.45);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .trainer-note { font-size: 0.78rem; color: rgba(255,255,255,0.3); margin-top: 4px; font-style: italic; }

    /* Note button & inline editor */
    .btn-note {
      background: none; border: 1px solid rgba(245,158,11,0.25);
      color: rgba(245,158,11,0.6); font-size: 0.75rem; font-weight: 600;
      padding: 3px 10px; border-radius: 15px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    }
    .btn-note:hover { border-color: #f59e0b; color: #f59e0b; }
    .btn-note.has-note { border-color: rgba(245,158,11,0.5); color: #f59e0b; }
    .note-editor {
      display: none; margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .note-editor.open { display: block; }
    .note-textarea {
      background: rgba(15,23,42,0.6); border: 1px solid rgba(245,158,11,0.3);
      color: white; border-radius: 8px; padding: 8px 12px; width: 100%;
      font-size: 0.85rem; resize: none; outline: none; box-sizing: border-box;
      font-family: inherit; min-height: 60px;
    }
    .note-textarea:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.12); }
    .note-textarea::placeholder { color: rgba(255,255,255,0.25); }
    .athlete-note-display {
      font-size: 0.78rem; color: #f59e0b; margin-top: 5px;
      display: flex; align-items: flex-start; gap: 5px;
    }

    /* ── Log button ── */
    .btn-log {
      background: #72b832; border: none; color: white; font-weight: 700;
      padding: 12px 28px; border-radius: 25px; font-size: 0.95rem;
      cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(114,184,50,0.3);
      display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; margin-bottom: 40px;
    }
    .btn-log:hover { background: #5a9528; transform: translateY(-2px); }
    .btn-log:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }

    /* ── History cards ── */
    .history-card {
      background: rgba(30,41,59,0.85); border: 1px solid rgba(114,184,50,0.15);
      border-radius: 13px; padding: 18px 22px; margin-bottom: 12px;
    }
    .history-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
    }
    .history-date { font-size: 0.95rem; font-weight: 700; color: rgba(255,255,255,0.85); }
    .history-program { font-size: 0.78rem; color: rgba(255,255,255,0.4); margin-top: 2px; }
    .history-badge {
      background: rgba(114,184,50,0.12); border: 1px solid rgba(114,184,50,0.3);
      color: #72b832; font-size: 0.75rem; font-weight: 700;
      padding: 3px 12px; border-radius: 20px;
    }
    .history-exercises {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
    }
    .history-ex-pill {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 2px 10px; font-size: 0.75rem; color: rgba(255,255,255,0.45);
    }

    /* ── Empty states ── */
    .empty-state { text-align: center; padding: 70px 20px; }
    .empty-state i { font-size: 3rem; color: rgba(114,184,50,0.2); display: block; margin-bottom: 16px; }
    .empty-state p { color: rgba(255,255,255,0.35); font-size: 0.95rem; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1e293b; border: 1px solid rgba(114,184,50,0.4);
      border-radius: 14px; padding: 14px 22px; z-index: 99999;
      display: none; align-items: center; gap: 10px; font-size: 0.9rem;
      color: rgba(255,255,255,0.85); box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .toast.show { display: flex; }

    .loading-overlay {
      position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 1.1rem; color: rgba(255,255,255,0.5); gap: 12px;
    }

    @media (max-width: 768px) {
      .top-nav { padding: 14px 16px; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <i class="fa-solid fa-spinner fa-spin"></i> Loading…
</div>

<nav class="top-nav">
  <div class="nav-brand">
    <img src="CoachSyncLogo.png" alt="CoachSync" style="height:72px;">
  </div>
  <div class="nav-right">
    <a href="athlete-dashboard.html" class="btn-back">
      <i class="fa-solid fa-arrow-left"></i> Dashboard
    </a>
    <button class="btn-logout" onclick="doSignOut()">
      <i class="fa-solid fa-right-from-bracket me-1"></i>Sign Out
    </button>
  </div>
</nav>

<div class="container" style="max-width:800px;">
  <div class="page-header">
    <h1><i class="fa-solid fa-dumbbell me-2" style="font-size:1.5rem;"></i>My Workouts</h1>
  </div>

  <!-- Main tabs -->
  <div class="main-tabs">
    <button class="main-tab active" id="tabToday" onclick="setMainTab('today')">
      <i class="fa-solid fa-calendar-day me-1"></i> Today's Workout
    </button>
    <button class="main-tab" id="tabHistory" onclick="setMainTab('history')">
      <i class="fa-solid fa-clock-rotate-left me-1"></i> History
    </button>
  </div>

  <!-- TODAY VIEW -->
  <div id="todayView">
    <div id="noProgramState" class="empty-state" style="display:none;">
      <i class="fa-solid fa-clipboard-list"></i>
      <p>No program assigned yet.<br>Your trainer will assign one soon.</p>
    </div>

    <div id="noStartDateState" class="empty-state" style="display:none;">
      <i class="fa-solid fa-calendar-plus"></i>
      <p>Program not started yet.<br>
        <a href="schedule.html" style="color:#72b832;font-weight:700;">Go to Schedule</a> to set your start date.</p>
    </div>

    <div id="programContent" style="display:none;">
      <!-- Program banner -->
      <div class="program-banner">
        <div class="program-banner-icon"><i class="fa-solid fa-clipboard-list"></i></div>
        <div>
          <div class="program-banner-name" id="programName">—</div>
          <div class="program-banner-meta" id="programMeta"></div>
        </div>
      </div>

      <!-- Week / Day header -->
      <div id="weekDayHeader" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="font-size:1.1rem;font-weight:800;color:#72b832;" id="weekDayLabel">Week 1 · Day 1</div>
        <div class="day-tabs" id="dayTabs" style="margin-bottom:0;"></div>
      </div>

      <!-- Progress -->
      <div class="progress-section">
        <div class="progress-label">
          <span id="dayProgressLabel">Progress</span>
          <span id="progressText">0 / 0 exercises</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
        </div>
      </div>

      <!-- Exercises -->
      <p class="section-label" id="exerciseSectionLabel">Exercises</p>
      <div id="exerciseList"></div>

      <button class="btn-log" id="btnLog" onclick="logWorkout()">
        <i class="fa-solid fa-circle-check"></i> Log Workout
      </button>
    </div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="historyView" style="display:none;">
    <div id="historyList"></div>
    <div id="historyEmpty" class="empty-state" style="display:none;">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <p>No workout history yet.<br>Complete a workout to see it here.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDnaS5J_-KkmFZcE3FtjjxV54cZkbWcop8",
    authDomain: "coachsync-7e07e.firebaseapp.com",
    projectId: "coachsync-7e07e",
    storageBucket: "coachsync-7e07e.firebasestorage.app",
    messagingSenderId: "774513797996",
    appId: "1:774513797996:web:e38f47773c5b487982e149"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUser   = null;
  let athleteData   = null;
  let programData   = null;
  let currentWeek   = 1;
  let currentDay    = 1;
  let completed     = new Set();
  let exerciseNotes = {};
  let todayLogId    = null;
  const todayKey    = new Date().toISOString().split('T')[0];

  // Compute week + day from programStartDate and daysPerWeek
  function computeWeekDay(startDateMs, daysPerWeek) {
    const msPerDay    = 86400000;
    const startDay    = Math.floor(startDateMs / msPerDay);
    const todayDay    = Math.floor(Date.now()  / msPerDay);
    const dayIndex    = Math.max(0, todayDay - startDay); // 0-based days since start
    const week        = Math.floor(dayIndex / daysPerWeek) + 1;
    const day         = (dayIndex % daysPerWeek) + 1;
    return { week, day };
  }

  // ── Auth ──
  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;
    const snap = await db.collection('users').doc(user.uid).get();
    if (!snap.exists || snap.data().role === 'trainer') {
      window.location.href = 'index.html'; return;
    }
    athleteData = snap.data();
    await loadProgram();
    document.getElementById('loadingOverlay').style.display = 'none';
  });

  // ── Main tab switch ──
  function setMainTab(tab) {
    document.getElementById('tabToday').classList.toggle('active', tab === 'today');
    document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
    document.getElementById('todayView').style.display   = tab === 'today'   ? 'block' : 'none';
    document.getElementById('historyView').style.display = tab === 'history' ? 'block' : 'none';
    if (tab === 'history') loadHistory();
  }

  // ── Load program ──
  async function loadProgram() {
    const progName = athleteData.assignedProgram;
    if (!progName) {
      document.getElementById('noProgramState').style.display = 'block';
      return;
    }

    const snap = await db.collection('programs').where('name', '==', progName).get();
    if (snap.empty) {
      document.getElementById('noProgramState').style.display = 'block';
      return;
    }

    programData = { id: snap.docs[0].id, ...snap.docs[0].data() };

    // Check start date — required to know which week/day we're on
    if (!athleteData.programStartDate) {
      document.getElementById('noStartDateState').style.display = 'block';
      return;
    }

    const numDays = parseInt(programData.daysPerWeek) || 1;
    const pos     = computeWeekDay(athleteData.programStartDate, numDays);
    currentWeek   = pos.week;
    currentDay    = pos.day;

    await loadDayLog();
    renderProgram();
    document.getElementById('programContent').style.display = 'block';
  }

  // ── Load the log for the current week+day ──
  async function loadDayLog() {
    const logSnap = await db.collection('workoutLogs')
      .where('athleteId', '==', currentUser.uid)
      .where('week', '==', currentWeek)
      .get();
    // Note: 'week' field won't exist on old logs — those are ignored here

    const logDoc = logSnap.docs.find(d => d.data().day === currentDay);
    if (logDoc) {
      todayLogId    = logDoc.id;
      completed     = new Set(logDoc.data().completedExercises || []);
      exerciseNotes = logDoc.data().exerciseNotes || {};
    } else {
      todayLogId    = null;
      completed     = new Set();
      exerciseNotes = {};
    }
  }

  // ── Render program banner + day tabs + exercises ──
  function renderProgram() {
    document.getElementById('programName').textContent = programData.name;

    document.getElementById('programMeta').innerHTML = [
      programData.difficulty  ? `<span class="meta-pill"><i class="fa-solid fa-signal"></i>${esc(programData.difficulty)}</span>` : '',
      programData.duration    ? `<span class="meta-pill"><i class="fa-regular fa-clock"></i>${esc(programData.duration)}</span>` : '',
      programData.daysPerWeek ? `<span class="meta-pill"><i class="fa-solid fa-calendar-days"></i>${esc(programData.daysPerWeek)} days/week</span>` : '',
      programData.goal        ? `<span class="meta-pill"><i class="fa-solid fa-bullseye"></i>${esc(programData.goal)}</span>` : '',
    ].join('');

    renderDayTabs();
    renderExercises();
  }

  function updateWeekDayLabel() {
    document.getElementById('weekDayLabel').textContent = `Week ${currentWeek} · Day ${currentDay}`;
    document.getElementById('exerciseSectionLabel').textContent = `Week ${currentWeek} · Day ${currentDay} Exercises`;
  }

  // ── Day tabs ──
  function renderDayTabs() {
    const numDays = parseInt(programData.daysPerWeek) || 1;
    const container = document.getElementById('dayTabs');
    container.innerHTML = '';
    for (let d = 1; d <= numDays; d++) {
      container.insertAdjacentHTML('beforeend',
        `<button class="day-tab ${d === currentDay ? 'active' : ''}" onclick="setDay(${d})">Day ${d}</button>`);
    }
    updateWeekDayLabel();
  }

  // ── Switch to a different day within the current week ──
  async function setDay(day) {
    currentDay = day;
    await loadDayLog();
    document.querySelectorAll('.day-tab').forEach((btn, i) => {
      btn.classList.toggle('active', i + 1 === day);
    });
    updateWeekDayLabel();
    renderExercises();
  }

  // ── Get exercises for current day ──
  // All exercises show every day — each day is a fresh log of the same workout
  function getDayExercises() {
    return (programData.exercises || []).map((ex, i) => ({ ...ex, globalIndex: i }));
  }

  // ── Render exercises ──
  function renderExercises() {
    const list = document.getElementById('exerciseList');
    const dayExercises = getDayExercises();
    list.innerHTML = '';

    dayExercises.forEach(ex => {
      const gi   = ex.globalIndex;
      const key  = gi.toString();
      const done = completed.has(key);
      const noteKey = `${currentDay}_${gi}`;
      const note = exerciseNotes[noteKey] || '';

      list.insertAdjacentHTML('beforeend', `
        <div class="exercise-card ${done ? 'completed' : ''}" id="ex-${gi}">
          <div class="exercise-card-top">
            <div class="exercise-checkbox" onclick="toggleExercise(${gi})">
              <i class="fa-solid fa-check"></i>
            </div>
            <div class="exercise-info">
              <div class="exercise-name">${esc(ex.name)}</div>
              <div class="exercise-details">
                ${ex.sets ? `<span><i class="fa-solid fa-layer-group"></i> ${esc(ex.sets)} sets</span>` : ''}
                ${ex.reps ? `<span><i class="fa-solid fa-repeat"></i> ${esc(ex.reps)} reps</span>` : ''}
                ${ex.rest ? `<span><i class="fa-regular fa-clock"></i> ${esc(ex.rest)}s rest</span>` : ''}
              </div>
              ${ex.notes ? `<div class="trainer-note"><i class="fa-solid fa-whistle" style="font-size:0.7rem;margin-right:3px;"></i>${esc(ex.notes)}</div>` : ''}
              ${note ? `<div class="athlete-note-display" id="note-display-${gi}"><i class="fa-solid fa-pen-to-square" style="font-size:0.7rem;margin-top:2px;"></i>${esc(note)}</div>` : `<div class="athlete-note-display" id="note-display-${gi}" style="display:none;"></div>`}
            </div>
            <button class="btn-note ${note ? 'has-note' : ''}" id="note-btn-${gi}" onclick="toggleNote(${gi})">
              <i class="fa-solid fa-pen-to-square"></i>${note ? 'Edit' : 'Note'}
            </button>
          </div>
          <div class="note-editor" id="note-editor-${gi}">
            <textarea class="note-textarea" id="note-ta-${gi}" placeholder="Add your note (e.g. felt strong, increased weight…)"
              onblur="saveNote(${gi})">${esc(note)}</textarea>
          </div>
        </div>`);
    });

    updateProgress();
  }

  // ── Toggle exercise complete ──
  function toggleExercise(gi) {
    const key = gi.toString();
    completed.has(key) ? completed.delete(key) : completed.add(key);
    const card = document.getElementById('ex-' + gi);
    card.classList.toggle('completed', completed.has(key));
    updateProgress();
    saveProgress();
  }

  // ── Progress bar ──
  function updateProgress() {
    const total = getDayExercises().length;
    const done  = completed.size;
    document.getElementById('dayProgressLabel').textContent = `Week ${currentWeek} · Day ${currentDay} Progress`;
    document.getElementById('progressText').textContent = `${done} / ${total} exercises`;
    document.getElementById('progressBar').style.width = total ? (done / total * 100) + '%' : '0%';
    document.getElementById('btnLog').disabled = done === 0;
  }

  // ── Toggle note editor ──
  function toggleNote(gi) {
    const editor = document.getElementById('note-editor-' + gi);
    editor.classList.toggle('open');
    if (editor.classList.contains('open')) {
      document.getElementById('note-ta-' + gi).focus();
    }
  }

  // ── Save note on blur ──
  async function saveNote(gi) {
    const noteKey = `${currentDay}_${gi}`;
    const text    = document.getElementById('note-ta-' + gi).value.trim();
    exerciseNotes[noteKey] = text;

    // Update display
    const display = document.getElementById('note-display-' + gi);
    const btn     = document.getElementById('note-btn-' + gi);
    if (text) {
      display.innerHTML = `<i class="fa-solid fa-pen-to-square" style="font-size:0.7rem;margin-top:2px;"></i>${esc(text)}`;
      display.style.display = 'flex';
      btn.classList.add('has-note');
      btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Edit';
    } else {
      display.style.display = 'none';
      btn.classList.remove('has-note');
      btn.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Note';
    }

    await saveProgress();
  }

  // ── Save progress to Firestore ──
  async function saveProgress() {
    const dayExercises = getDayExercises();
    try {
      const data = {
        athleteId:          currentUser.uid,
        programName:        programData.name,
        week:               currentWeek,
        day:                currentDay,
        date:               todayKey,
        completedExercises: Array.from(completed),
        exerciseNames:      dayExercises.map(ex => ex.name),
        exerciseNotes:      exerciseNotes,
        totalExercises:     dayExercises.length,
        updatedAt:          firebase.firestore.FieldValue.serverTimestamp()
      };

      if (todayLogId) {
        await db.collection('workoutLogs').doc(todayLogId).update(data);
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        const ref = await db.collection('workoutLogs').add(data);
        todayLogId = ref.id;
      }
    } catch(e) {
      console.error('Error saving progress:', e);
    }
  }

  // ── Log today's workout ──
  async function logWorkout() {
    if (completed.size === 0) return;
    const total = getDayExercises().length;
    const btn   = document.getElementById('btnLog');
    btn.disabled  = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving…';

    try {
      await saveProgress();
      await db.collection('users').doc(currentUser.uid).update({
        sessionsCompleted: firebase.firestore.FieldValue.increment(1),
        lastWorkout:       firebase.firestore.FieldValue.serverTimestamp()
      });
      showToast(`Week ${currentWeek} · Day ${currentDay} logged! ${completed.size} of ${total} completed.`);
      btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Workout Logged!';
    } catch(e) {
      showToast('Error saving workout.', true);
      btn.disabled  = false;
      btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Log Workout';
    }
  }

  // ── Load history ──
  async function loadHistory() {
    const list  = document.getElementById('historyList');
    const empty = document.getElementById('historyEmpty');
    list.innerHTML = '<p style="color:rgba(255,255,255,0.3);font-size:0.9rem;">Loading history…</p>';

    try {
      const snap = await db.collection('workoutLogs')
        .where('athleteId', '==', currentUser.uid)
        .get();

      const logs = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => b.date.localeCompare(a.date));

      list.innerHTML = '';

      if (logs.length === 0) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      logs.forEach(log => {
        const dateObj = new Date(log.date + 'T12:00:00');
        const dateStr = dateObj.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        const done    = (log.completedExercises || []).length;
        const total   = log.totalExercises || (log.exerciseNames || []).length || '?';
        const names   = log.exerciseNames || [];
        const completedNames = names.filter((_, i) => (log.completedExercises || []).includes(i.toString()));

        list.insertAdjacentHTML('beforeend', `
          <div class="history-card">
            <div class="history-card-header">
              <div>
                <div class="history-date">${dateStr}${log.week ? ` — Week ${log.week} · Day ${log.day}` : (log.day ? ` — Day ${log.day}` : '')}</div>
                <div class="history-program">${esc(log.programName || '')}</div>
              </div>
              <span class="history-badge">${done} / ${total} completed</span>
            </div>
            ${completedNames.length ? `
            <div class="history-exercises">
              ${completedNames.map(n => `<span class="history-ex-pill">${esc(n)}</span>`).join('')}
            </div>` : ''}
          </div>`);
      });
    } catch(e) {
      list.innerHTML = `<p style="color:#ef4444;font-size:0.9rem;">Error loading history: ${e.message}</p>`;
    }
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg, error = false) {
    const t = document.getElementById('toast');
    t.className = 'toast show';
    t.style.borderColor = error ? 'rgba(239,68,68,0.5)' : 'rgba(114,184,50,0.4)';
    t.innerHTML = `<i class="fa-solid fa-${error ? 'circle-exclamation' : 'circle-check'}" style="color:${error ? '#ef4444' : '#72b832'};"></i> ${msg}`;
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  async function doSignOut() {
    await auth.signOut();
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
