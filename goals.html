<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="CoachSyncLogo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1C1C1C" />
  <title>My Goals - CoachSync</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1C1C1C 0%, #114084 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: rgba(255,255,255,0.9);
    }
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(53,102,171,0.15);
      background: rgba(28,28,28,0.6);
    }
    .nav-right { display: flex; gap: 8px; align-items: center; }
    .btn-back {
      background: none; border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6); font-size: 0.8rem; font-weight: 600;
      padding: 5px 12px; border-radius: 25px; cursor: pointer;
      text-decoration: none; transition: all 0.2s; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-back:hover { border-color: #3566AB; color: #3566AB; }
    .btn-logout {
      background: none; border: 1px solid rgba(239,68,68,0.4);
      color: rgba(239,68,68,0.8); font-size: 0.8rem; font-weight: 600;
      padding: 5px 12px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
    }
    .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.08); }
    .page-header { padding: 22px 0 16px; }
    .page-header h1 {
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, #3566AB, #83B7DE);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0;
    }
    .page-header p { color: rgba(255,255,255,0.45); font-size: 0.88rem; margin: 6px 0 0; }
    .goal-form {
      background: rgba(17,64,132,0.82); border: 1px solid rgba(53,102,171,0.18);
      border-radius: 12px; padding: 18px; margin-bottom: 18px;
    }
    .goal-row { margin-bottom: 18px; }
    .goal-row:last-child { margin-bottom: 0; }
    .goal-label {
      font-size: 0.78rem; font-weight: 800; color: rgba(255,255,255,0.72);
      text-transform: uppercase; letter-spacing: 0.45px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .goal-label i { color: #83B7DE; }
    .goal-input {
      width: 100%; min-height: 118px; resize: vertical;
      background: rgba(28,28,28,0.48); border: 1px solid rgba(255,255,255,0.12);
      color: white; border-radius: 10px; padding: 12px 14px; outline: none; font-size: 0.92rem; line-height: 1.5;
    }
    .goal-input:focus { border-color: #3566AB; box-shadow: 0 0 0 3px rgba(53,102,171,0.18); }
    .goal-input::placeholder { color: rgba(255,255,255,0.28); }
    .meta-panel {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; padding: 12px 14px; color: rgba(255,255,255,0.45); font-size: 0.82rem; margin-bottom: 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .btn-save {
      background: #3566AB; border: none; color: white; font-weight: 800;
      padding: 11px 18px; border-radius: 25px; cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-save:hover { background: #114084; transform: translateY(-1px); }
    .btn-save:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
    .status {
      display: none; margin-top: 12px; padding: 10px 12px; border-radius: 9px; font-size: 0.84rem;
    }
    .status.ok { display: block; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.28); color: #10b981; }
    .status.err { display: block; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.28); color: #ef4444; }
    .loading-overlay {
      position: fixed; inset: 0; background: linear-gradient(135deg, #1C1C1C, #114084);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; font-size: 1.1rem; color: rgba(255,255,255,0.5); gap: 12px;
    }
    @media (max-width: 575px) {
      .goal-form { padding: 14px; }
      .goal-input { min-height: 132px; }
    }
  </style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <i class="fa-solid fa-spinner fa-spin"></i> Loading...
</div>

<nav class="top-nav">
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="CoachSyncLogo.png" alt="CoachSync" style="height:44px;">
  </div>
  <div class="nav-right">
    <a href="athlete-dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    <button class="btn-logout" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</nav>

<div class="container" style="max-width:760px;">
  <div class="page-header">
    <h1><i class="fa-solid fa-bullseye me-2" style="font-size:1.2rem;"></i>My Goals</h1>
    <p>Set the milestones your coach can use to guide programming and accountability.</p>
  </div>

  <div class="meta-panel">
    <span id="trainerLabel"><i class="fa-solid fa-user-tie me-1"></i> Coach visibility depends on your trainer connection.</span>
    <span id="updatedLabel"></span>
  </div>

  <form class="goal-form" onsubmit="saveGoals(event)">
    <div class="goal-row">
      <label class="goal-label" for="goal90"><i class="fa-solid fa-calendar-day"></i> 90-day goal</label>
      <textarea class="goal-input" id="goal90" maxlength="1200" placeholder="What should be clearly better in the next 90 days?"></textarea>
    </div>
    <div class="goal-row">
      <label class="goal-label" for="goal180"><i class="fa-solid fa-calendar-week"></i> 180-day goal</label>
      <textarea class="goal-input" id="goal180" maxlength="1200" placeholder="What larger performance, body composition, habit, or competition target are you working toward?"></textarea>
    </div>
    <div class="goal-row">
      <label class="goal-label" for="goal365"><i class="fa-solid fa-calendar-days"></i> 1-year goal</label>
      <textarea class="goal-input" id="goal365" maxlength="1200" placeholder="Where do you want to be one year from now?"></textarea>
    </div>
    <button class="btn-save" id="btnSave" type="submit">
      <i class="fa-solid fa-floppy-disk"></i> Save Goals
    </button>
    <div class="status" id="statusBox"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const firebaseConfig = window.CoachSyncFirebaseConfig;
  if (!firebaseConfig) {
    throw new Error('Missing Firebase config. Create firebase-config.js from firebase-config.example.js.');
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let currentUser = null;
  let athleteData = null;

  auth.onAuthStateChanged(async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;

    const userSnap = await db.collection('users').doc(user.uid).get();
    if (!userSnap.exists || userSnap.data().role === 'trainer') {
      window.location.href = 'index.html';
      return;
    }
    athleteData = { id: userSnap.id, ...userSnap.data() };

    if (athleteData.trainerName) {
      document.getElementById('trainerLabel').innerHTML = `<i class="fa-solid fa-user-tie me-1"></i> Visible to ${esc(athleteData.trainerName)}`;
    }

    await loadGoals();
    document.getElementById('loadingOverlay').style.display = 'none';
  });

  async function loadGoals() {
    const snap = await db.collection('goals').doc(currentUser.uid).get();
    if (!snap.exists) return;

    const data = snap.data();
    document.getElementById('goal90').value = data.goal90 || '';
    document.getElementById('goal180').value = data.goal180 || '';
    document.getElementById('goal365').value = data.goal365 || '';
    document.getElementById('updatedLabel').textContent = data.updatedAt
      ? 'Updated ' + new Date(data.updatedAt.seconds * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      : '';
  }

  async function saveGoals(event) {
    event.preventDefault();
    const btn = document.getElementById('btnSave');
    const status = document.getElementById('statusBox');
    status.className = 'status';
    status.textContent = '';
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

    try {
      const payload = {
        athleteId: currentUser.uid,
        athleteName: athleteData.displayName || currentUser.displayName || athleteData.email || '',
        trainerId: athleteData.trainerId || null,
        goal90: document.getElementById('goal90').value.trim(),
        goal180: document.getElementById('goal180').value.trim(),
        goal365: document.getElementById('goal365').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await db.collection('goals').doc(currentUser.uid).set(payload, { merge: true });
      status.className = 'status ok';
      status.textContent = 'Goals saved.';
      document.getElementById('updatedLabel').textContent = 'Updated just now';
    } catch (e) {
      status.className = 'status err';
      status.textContent = 'Error saving goals: ' + e.message;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Goals';
    }
  }

  function esc(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function doSignOut() {
    await auth.signOut();
    window.location.href = 'index.html';
  }
</script>
<script src="theme.js"></script>
</body>
</html>
